[package]
name = "sakura-desktop"
version = "2.0.0"
description = "Gestor, reproductor, descargador y etiquetador de música para escritorio"
authors = ["Sakura Music"]
edition = "2024"
default-run = "sakura-desktop"

[lib]
name = "sakura_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sakura-desktop"
path = "src/main.rs"

[[bin]]
name = "sakura-cli"
path = "src/bin/sakura-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
lofty = "0.21"
walkdir = "2"
rayon = "1.10"
rusqlite = { version = "0.42.0", features = ["bundled"] }
notify = "8.2.2"
# Mutex que no se envenena: un panic en un hilo de descarga no puede matar la app.
parking_lot = "0.12"
# Verificación de las herramientas que se descargan a `bin/`.
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Sin debug en dev acelera los builds iterativos y evita problemas de
# command line larga con MSVC en rutas de target extensas.
[profile.dev]
debug = 0

[profile.dev.package.libsqlite3-sys]
debug = 0

[profile.test.package.libsqlite3-sys]
debug = 0
