<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>06 · Jardín Karesansui (枯山水)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden; font-family: Georgia, serif;
      background-color: #ece8df;
      background-image: repeating-linear-gradient(0deg, transparent 0 10px, rgba(160,152,138,.24) 10px 12px);
      color: #24221f; padding: 36px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .borde-madera {
      flex: 1; border: 14px solid #3c332a; padding: 34px; position: relative;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: inset 0 0 40px rgba(0,0,0,.08);
    }
    .roca-grande {
      position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
      width: 310px; height: 220px; border-radius: 56% 44% 62% 38% / 48% 54% 46% 52%;
      background: radial-gradient(circle at 35% 30%, #4b4945, #1f1e1c);
      color: #f4f0e8; display: grid; place-items: center; text-align: center; padding: 24px;
      box-shadow: 0 24px 48px rgba(0,0,0,.28), 0 0 0 18px rgba(236,232,223,.65), 0 0 0 20px rgba(130,122,110,.35);
    }
    .piedra-paso {
      display: inline-block; background: #2c2a27; color: #f4f0e8;
      padding: 12px 22px; border-radius: 42% 58% 48% 52%; font-size: 13px;
      box-shadow: 4px 8px 18px rgba(0,0,0,.18); cursor: pointer;
    }
    .fila-piedras { display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  </style>
</head>
<body>
  <div class="borde-madera">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="letter-spacing:.2em;font-size:13px">枯山水 · JARDÍN DE ARENA RASTRILLADA</strong>
      <span style="font-size:12px;color:#6c645a">RYŌAN-JI · SILENCIO</span>
    </div>

    <div class="roca-grande">
      <div>
        <small style="letter-spacing:.2em;opacity:.7;display:block;margin-bottom:6px">EN LA ROCA CENTRAL</small>
        <strong style="font-size:20px;display:block">Lluvia en Kioto</strong>
        <div style="font-size:12px;opacity:.75;margin:6px 0 12px">Ichiko Aoba · 4:18</div>
        <div>◀◀ &nbsp; ⏸ &nbsp; ▶▶</div>
      </div>
    </div>

    <div class="fila-piedras">
      <div class="piedra-paso">Piedra 01 · Musgo</div>
      <div class="piedra-paso">Piedra 02 · Bambú</div>
      <div class="piedra-paso">Piedra 03 · Niebla</div>
      <div class="piedra-paso">Piedra 04 · Campana</div>
    </div>
  </div>
</body>
</html>
