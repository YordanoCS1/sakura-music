<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>03 · La Gran Ola (Ukiyo-e)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden; font-family: Georgia, serif;
      background: #f2e4c9; color: #162a45; display: flex; position: relative;
    }
    .ola-svg { position: absolute; left: 0; bottom: 0; width: 78%; height: auto; pointer-events: none; z-index: 1; }
    .fuji {
      position: absolute; right: 22%; bottom: 18%; width: 0; height: 0; z-index: 0;
      border-left: 160px solid transparent; border-right: 160px solid transparent; border-bottom: 180px solid #264b73;
      opacity: .22;
    }
    .principal { flex: 1; position: relative; z-index: 4; padding: 42px 54px; display: flex; flex-direction: column; justify-content: space-between; }
    .cartucho {
      background: #fff9ec; border: 3px solid #162a45; padding: 24px 28px; max-width: 460px;
      box-shadow: 10px 10px 0 #162a45;
    }
    .cartucho h1 { font-size: 42px; margin: 8px 0 12px; line-height: 1.08; }
    .lista-estampa { display: flex; gap: 14px; flex-wrap: wrap; max-width: 760px; }
    .estampa {
      background: rgba(255, 249, 236, .92); border: 2px solid #162a45; padding: 12px 16px;
      min-width: 190px; box-shadow: 4px 4px 0 #b93829;
    }
    .kakemono {
      width: 96px; background: #162a45; color: #f2e4c9; border-left: 6px solid #b93829;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 28px 10px; z-index: 5;
    }
    .kakemono .kanji { writing-mode: vertical-rl; font-size: 26px; letter-spacing: .25em; }
    .sello-rojo { width: 42px; height: 42px; background: #b93829; color: #fff; display: grid; place-items: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="fuji"></div>
  <svg class="ola-svg" viewBox="0 0 900 420" fill="none">
    <path d="M0 420 L0 180 C120 70 280 20 390 95 C430 120 435 165 390 190 C320 225 270 185 320 140 C240 125 165 180 225 255 C315 350 510 265 690 295 C790 310 855 355 900 390 L900 420 Z" fill="#163a5f"/>
    <path d="M0 245 C140 165 265 215 360 285 C480 370 675 305 900 375 L900 420 L0 420 Z" fill="#2c5f8a"/>
    <path d="M290 70 Q340 40 395 88 Q435 120 405 162" stroke="#fff9ec" stroke-width="14" stroke-linecap="round"/>
  </svg>

  <main class="principal">
    <div class="cartucho">
      <small style="color:#b93829;letter-spacing:.2em;font-weight:bold">富嶽三十六景 · UKIYO-E</small>
      <h1>La Gran Ola sonora</h1>
      <p style="margin:0;line-height:1.7;color:#354e6b">Xilografía de papel ocre, azul de Prusia y un rollo lateral vertical con sello bermellón para navegar.</p>
    </div>

    <div class="lista-estampa">
      <div class="estampa"><strong>Ola de Kanagawa</strong><div style="font-size:12px;color:#4f6680">Koto & Shamisen · 4:10</div></div>
      <div class="estampa"><strong>Fuji al Alba</strong><div style="font-size:12px;color:#4f6680">Edo Ensemble · 3:44</div></div>
      <div class="estampa"><strong>Barca en la Espuma</strong><div style="font-size:12px;color:#4f6680">Hokusai Tribute · 5:02</div></div>
    </div>
  </main>

  <aside class="kakemono">
    <div class="sello-rojo">波</div>
    <div class="kanji">神奈川沖浪裏</div>
    <div style="font-size:18px">▶</div>
  </aside>
</body>
</html>
