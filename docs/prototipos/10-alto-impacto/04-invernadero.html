<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>04 · Invernadero Art Nouveau</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; overflow: hidden; font-family: Georgia, serif;
      background: linear-gradient(150deg, #10261e 0%, #1d3f31 55%, #0e1e18 100%);
      color: #f0ebe1; padding: 24px; display: flex;
    }
    .marco-vitral {
      flex: 1; border: 3px solid #c9a55b; border-radius: 180px 180px 18px 18px;
      background: radial-gradient(circle at 50% 18%, rgba(255, 243, 204, .14), rgba(14, 30, 24, .7) 65%);
      box-shadow: inset 0 0 60px rgba(0,0,0,.55); padding: 34px 48px;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }
    .top { text-align: center; }
    .top small { color: #d8b873; letter-spacing: .26em; font-size: 11px; }
    .top h1 { font-size: 42px; font-weight: 400; margin: 8px 0; }
    .herbario { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .lamina {
      background: #f5efe2; color: #24332b; border: 2px solid #c9a55b; padding: 16px;
      border-radius: 8px; box-shadow: 0 14px 28px rgba(0,0,0,.35);
    }
    .planta { height: 110px; background: #e8e1d1; display: grid; place-items: center; font-size: 42px; margin-bottom: 10px; border: 1px solid #d4c6a5; }
    .placa-laton {
      align-self: center; background: linear-gradient(90deg, #8b6c30, #d8b873, #8b6c30);
      color: #1b1408; padding: 10px 30px; border-radius: 999px; font-weight: bold; font-size: 13px;
      display: flex; gap: 22px; align-items: center;
    }
  </style>
</head>
<body>
  <div class="marco-vitral">
    <div class="top">
      <small>CONSERVATORIO BOTÁNICO · ART NOUVEAU</small>
      <h1>Invernadero de Cristal y Latón</h1>
    </div>
    <div class="herbario">
      <div class="lamina"><div class="planta">🌿</div><strong>Helecho de Luz</strong><div style="font-size:12px;color:#5d6c62">Botanical Synth · 4:02</div></div>
      <div class="lamina"><div class="planta">🌺</div><strong>Orquídea Real</strong><div style="font-size:12px;color:#5d6c62">Clara Vance · 3:48</div></div>
      <div class="lamina"><div class="planta">🪴</div><strong>Monstera Deliciosa</strong><div style="font-size:12px;color:#5d6c62">Lluvia en Vidrio · 5:14</div></div>
      <div class="lamina"><div class="planta">🌼</div><strong>Lirio del Valle</strong><div style="font-size:12px;color:#5d6c62">Jardín 1900 · 3:55</div></div>
    </div>
    <div class="placa-laton">
      <span>▶ ORQUÍDEA REAL</span>
      <span>2:08 / 3:48</span>
      <span>◀◀ &nbsp; ⏸ &nbsp; ▶▶</span>
    </div>
  </div>
</body>
</html>
