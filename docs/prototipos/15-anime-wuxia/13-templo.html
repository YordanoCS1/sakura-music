<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>13 · Templo</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#e7ddc4;--pan:#f4ecd6;--tinta:#3a2f1e;--rojo:#a8322a;--suave:#7a6a4c}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:5px solid var(--rojo)}.nav b{color:var(--rojo)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.torii{width:200px;height:170px;border:10px solid var(--rojo);border-bottom:none;position:relative;flex:none}
.torii::before{content:'';position:absolute;top:24px;left:-20px;right:-20px;height:12px;background:var(--rojo)}
.torii::after{content:'';position:absolute;top:60px;left:0;right:0;height:8px;background:var(--rojo)}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;background:var(--rojo);color:#fff;padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:5px solid var(--rojo);padding-bottom:10px;margin-bottom:24px}.tit h1{font-size:30px;margin:0;font-weight:400}
.campanas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.campana{height:110px;border:3px solid var(--rojo);border-radius:50% 50% 10px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(168,50,42,.06)}
.campana b{font-size:24px;color:var(--rojo)}.campana small{font-size:9px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>寺 Templo</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="torii"></div><div class="copy"><p>寺 · TEMPLO SONORO</p><h1>Paz bajo el torii</h1><p>Campanas, incienso y silencio.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>SUTRA · 01</small><h1>Biblioteca</h1></div><span>8 CAMPANAS</span></div><div class="campanas"><div class="campana"><b>♪</b><small>Pista 0</small></div><div class="campana"><b>♪</b><small>Pista 1</small></div><div class="campana"><b>♪</b><small>Pista 2</small></div><div class="campana"><b>♪</b><small>Pista 3</small></div><div class="campana"><b>♪</b><small>Pista 4</small></div><div class="campana"><b>♪</b><small>Pista 5</small></div><div class="campana"><b>♪</b><small>Pista 6</small></div><div class="campana"><b>♪</b><small>Pista 7</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
