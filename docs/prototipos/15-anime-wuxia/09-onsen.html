<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>09 · Onsen</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#e6e0d2;--pan:#f5f0e4;--tinta:#3b3328;--madera:#8b6a4a;--vapor:#9fb8b5;--suave:#7d705c}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:3px solid var(--madera)}.nav b{color:var(--madera)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.bano{width:200px;height:150px;border:8px solid var(--madera);border-radius:50% 50% 10px 10px;display:grid;place-items:center;font-size:60px;color:var(--vapor);flex:none}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--madera);color:var(--madera);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:3px solid var(--madera);padding-bottom:10px;margin-bottom:22px}.tit h1{font-size:30px;margin:0;font-weight:400}
.piletas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pileta{border:6px solid var(--madera);border-radius:50% 50% 12px 12px;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(159,184,181,.4),transparent)}
.pileta strong{font-size:13px}.pileta small{font-size:9px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>♨ Onsen</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="bano">♨</div><div class="copy"><p>ONSEN · AGUAS TERMALES</p><h1>Relajarse y escuchar</h1><p>Vapor, madera y calma.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>BAÑO · 01</small><h1>Biblioteca</h1></div><span>8 PIEZAS</span></div><div class="piletas"><div class="pileta"><strong>Pista 0</strong><small>♨ 01</small></div><div class="pileta"><strong>Pista 1</strong><small>♨ 02</small></div><div class="pileta"><strong>Pista 2</strong><small>♨ 03</small></div><div class="pileta"><strong>Pista 3</strong><small>♨ 04</small></div><div class="pileta"><strong>Pista 4</strong><small>♨ 05</small></div><div class="pileta"><strong>Pista 5</strong><small>♨ 06</small></div><div class="pileta"><strong>Pista 6</strong><small>♨ 07</small></div><div class="pileta"><strong>Pista 7</strong><small>♨ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
