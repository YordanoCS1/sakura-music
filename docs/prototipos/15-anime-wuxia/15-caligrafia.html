<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · Caligrafía</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#eee7d8;--pan:#f8f2e4;--tinta:#2c2620;--tinta2:#9c3428;--suave:#7a6d58}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:3px solid var(--tinta)}.nav b{color:var(--tinta2)}
.home{display:flex;align-items:center;gap:50px;min-height:68vh}
.pincel{width:180px;height:260px;border:2px solid var(--tinta);display:grid;place-items:center;font-size:78px;color:var(--tinta);flex:none}
.copy h1{font-size:52px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--tinta2);color:var(--tinta2);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:3px solid var(--tinta);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.tiras{display:flex;gap:10px}
.tira{width:60px;min-height:260px;border:1px solid #c9bda6;background:var(--pan);padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tira span{writing-mode:vertical-rl;font-size:14px;color:var(--tinta);height:180px}
.tira small{font-size:9px;color:var(--tinta2)}
</style></head><body>
<div class="nav"><b>書 Caligrafía</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="pincel">書</div><div class="copy"><p>書 · ARTE DE LA TINTA</p><h1>La música escrita</h1><p>Un trazo, una nota.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>FOLIO · 01</small><h1>Biblioteca</h1></div><span>8 TRAZOS</span></div><div class="tiras"><div class="tira"><span>Pista 0</span><small>01</small></div><div class="tira"><span>Pista 1</span><small>02</small></div><div class="tira"><span>Pista 2</span><small>03</small></div><div class="tira"><span>Pista 3</span><small>04</small></div><div class="tira"><span>Pista 4</span><small>05</small></div><div class="tira"><span>Pista 5</span><small>06</small></div><div class="tira"><span>Pista 6</span><small>07</small></div><div class="tira"><span>Pista 7</span><small>08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
