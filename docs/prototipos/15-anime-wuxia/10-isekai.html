<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · Isekai</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#141028;--pan:#1f1840;--tinta:#f4ecff;--morado:#a06cf5;--oro:#f5c85a;--suave:#b0a0d0}
body{background:radial-gradient(circle at 70% 30%,#2a1c50,#141028);color:var(--tinta);font-family:Georgia,serif}
.nav{background:#100c22;border-bottom:2px solid var(--morado)}.nav b{color:var(--oro)}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:68vh}
.portal{width:180px;height:180px;border-radius:50%;border:4px solid var(--oro);background:radial-gradient(circle,rgba(160,108,245,.8),transparent 70%);box-shadow:0 0 70px rgba(160,108,245,.6);display:grid;place-items:center;font-size:56px;margin-bottom:20px}
.copy h1{font-size:44px;font-weight:400}.copy p{color:var(--suave);max-width:420px;line-height:1.8}
.btn{display:inline-block;border:1px solid var(--oro);color:var(--oro);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:2px solid var(--oro);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.portales{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.portal2{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--oro);background:radial-gradient(circle,rgba(160,108,245,.6),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 20px rgba(160,108,245,.3)}
.portal2 b{font-size:12px}.portal2 small{font-size:8px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>✧ Isekai</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="portal">✧</div><div class="copy"><p>ISEKAI · OTRO MUNDO</p><h1>Un viaje sonoro</h1><p>Cruzá el portal a otra biblioteca.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>REINO · 01</small><h1>Biblioteca</h1></div><span>8 PORTONES</span></div><div class="portales"><div class="portal2"><b>Pista 0</b><small>01 · 3:20</small></div><div class="portal2"><b>Pista 1</b><small>02 · 3:20</small></div><div class="portal2"><b>Pista 2</b><small>03 · 3:20</small></div><div class="portal2"><b>Pista 3</b><small>04 · 3:20</small></div><div class="portal2"><b>Pista 4</b><small>05 · 3:20</small></div><div class="portal2"><b>Pista 5</b><small>06 · 3:20</small></div><div class="portal2"><b>Pista 6</b><small>07 · 3:20</small></div><div class="portal2"><b>Pista 7</b><small>08 · 3:20</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
