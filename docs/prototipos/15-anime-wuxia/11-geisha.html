<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · Geisha</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#f7eef2;--pan:#fff;--tinta:#4a2a3a;--rosa:#d24f84;--oro:#c9a961;--suave:#9a7086}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:#fff;border-bottom:3px double var(--rosa)}.nav b{color:var(--rosa)}
.home{display:flex;align-items:center;gap:50px;min-height:68vh}
.abanico{width:200px;height:130px;border-radius:100px 100px 0 0;border:3px solid var(--oro);background:repeating-conic-gradient(from 180deg at 50% 100%,rgba(210,79,132,.15) 0deg 12deg,transparent 12deg 24deg);display:grid;place-items:center;font-size:44px;color:var(--rosa);flex:none}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--rosa);color:var(--rosa);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:3px double var(--rosa);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.abanicos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.abanico2{width:100%;aspect-ratio:1.1;border-radius:100px 100px 6px 6px;border:2px solid var(--oro);background:repeating-conic-gradient(from 180deg at 50% 100%,rgba(210,79,132,.12) 0deg 14deg,transparent 14deg 28deg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.abanico2 b{background:#fff;padding:3px 6px;border:1px solid var(--rosa);font-size:10px}
</style></head><body>
<div class="nav"><b>花 Geisha</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="abanico">花</div><div class="copy"><p>花 · ARTE Y ELEGANCIA</p><h1>Gracia en cada nota</h1><p>Abanicos de seda y música delicada.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>OCHAYA · 01</small><h1>Biblioteca</h1></div><span>8 ABANICOS</span></div><div class="abanicos"><div class="abanico2"><b>Pista 0</b></div><div class="abanico2"><b>Pista 1</b></div><div class="abanico2"><b>Pista 2</b></div><div class="abanico2"><b>Pista 3</b></div><div class="abanico2"><b>Pista 4</b></div><div class="abanico2"><b>Pista 5</b></div><div class="abanico2"><b>Pista 6</b></div><div class="abanico2"><b>Pista 7</b></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
