<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Kung Fu</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#f0e2c8;--pan:#faf1dc;--tinta:#3a2a1a;--rojo:#b8231e;--oro:#c9973f;--suave:#806a4c}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:4px double var(--rojo)}.nav b{color:var(--rojo);letter-spacing:.2em}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.puño{width:200px;height:200px;border:5px solid var(--rojo);border-radius:50%;display:grid;place-items:center;font-size:72px;color:var(--rojo);flex:none}
.copy h1{font-size:48px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;background:var(--rojo);color:#fff;padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:4px double var(--rojo);padding-bottom:10px;margin-bottom:22px}.tit h1{font-size:30px;margin:0;font-weight:400}
.sellos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sello{aspect-ratio:1;border:3px double var(--rojo);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-6deg);background:rgba(184,35,30,.05)}
.sello b{font-size:22px;color:var(--rojo)}.sello small{font-size:8px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>武 Kung Fu</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="puño">武</div><div class="copy"><p>武 · ARTE MARCIAL</p><h1>La fuerza interior</h1><p>Disciplina y técnica. Cada canción es una forma.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>TEMPLO · 01</small><h1>Biblioteca</h1></div><span>8 FORMAS</span></div><div class="sellos"><div class="sello"><b>武</b><small>Pista 0</small></div><div class="sello"><b>武</b><small>Pista 1</small></div><div class="sello"><b>武</b><small>Pista 2</small></div><div class="sello"><b>武</b><small>Pista 3</small></div><div class="sello"><b>武</b><small>Pista 4</small></div><div class="sello"><b>武</b><small>Pista 5</small></div><div class="sello"><b>武</b><small>Pista 6</small></div><div class="sello"><b>武</b><small>Pista 7</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
