<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · Lacquer</title><style>
:root{--n:#100606;--rojo:#8e1f1f;--oro:#d4af37;--crema:#f0e2cc}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--n);color:var(--crema);font-family:Georgia,serif}
.cab{height:52px;display:flex;align-items:center;gap:24px;padding:0 30px;border-bottom:1px solid var(--oro)}
.cab b{font-weight:400;letter-spacing:.24em;color:var(--oro)}.cab button{background:none;border:0;color:#b39a80;font:10px Georgia;letter-spacing:.16em;cursor:pointer}
.cab button.on{color:var(--oro)}
.vista{display:none;height:calc(100vh - 52px - 72px);overflow:auto;padding:34px 44px}.vista.on{display:block}
/* HOME: caja lacada */
.caja{min-height:70vh;display:flex;align-items:center;justify-content:center}
.bandeja{width:min(600px,72%);padding:46px;border:6px solid var(--rojo);background:linear-gradient(145deg,#2a0d0d,#160606);box-shadow:inset 0 0 0 2px var(--oro),16px 18px 0 rgba(142,31,31,.3)}
.bandeja h1{font-size:50px;font-weight:400;margin:10px 0;color:var(--oro)}.bandeja p{color:#c9ab90;line-height:1.9}
/* LIBRARY: barras lacadas */
.tit{display:flex;justify-content:space-between;border-bottom:2px solid var(--oro);padding-bottom:12px;margin-bottom:20px}
.tit h1{font-size:40px;font-weight:400;margin:6px 0}
.filtros{display:flex;gap:8px;margin-bottom:20px}.filtros button{border:1px solid var(--oro);background:transparent;color:var(--oro);padding:6px 12px;font:10px Georgia;cursor:pointer}
.filtros button.on{background:var(--oro);color:var(--n)}
.barras{display:flex;flex-direction:column;gap:10px}
.barra{display:flex;align-items:center;gap:18px;padding:14px 20px;background:linear-gradient(90deg,#2a0d0d,#1a0808);border-left:5px solid var(--rojo);border-right:1px solid rgba(212,175,55,.3)}
.barra .gl{color:var(--oro);font-size:20px}.barra strong{font-weight:400;font-size:19px}.barra small{font:10px Georgia;color:#b39a80;display:block}
.barra .d{margin-left:auto;color:var(--oro);font:11px Georgia}
.repro{position:fixed;bottom:0;left:0;right:0;height:72px;border-top:1px solid var(--oro);display:flex;align-items:center;padding:0 30px;background:#120505}
.repro button{margin-left:auto;border:1px solid var(--oro);background:var(--rojo);color:var(--oro);width:38px;height:38px;cursor:pointer}
</style></head><body>
<div class="cab"><b>漆 · SAKURA</b><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></div>
<section class="vista on" id="home"><div class="caja"><div class="bandeja"><p style="font:10px Georgia;letter-spacing:.3em">LACQUER · ROJO Y ORO</p><h1>Lujo sin ruido</h1><p>Laca roja, filete de oro. Tu música guardada como una pieza de altar.</p><p style="color:var(--oro)">Abrir biblioteca →</p></div></div></section>
<section class="vista" id="lib"><div class="tit"><div><small style="font:10px Georgia;letter-spacing:.2em;color:var(--oro)">01 · COLECCIÓN</small><h1>Biblioteca</h1></div><span>8 piezas</span></div>
<div class="filtros"><button class="on">Todas juntas</button><button>◀ Subir</button><button>＋ Elegir carpeta</button><button>laca · 3</button></div>
<div class="barras" id="b"></div></section>
<div class="repro"><span style="color:#b39a80;font-size:11px">Sin pista seleccionada</span><button>▶</button></div>
<script>
document.getElementById('b').innerHTML=Array.from({length:8},(_,i)=>`<div class="barra"><span class="gl">漆</span><div><strong>Pista ${i}</strong><small>Artista ${i} · Álbum ${i}</small></div><span class="d">3:20</span></div>`).join('');
document.querySelectorAll('.cab button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.cab button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
