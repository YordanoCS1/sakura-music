<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · Sumi Ink</title><style>
:root{--tinta:#0c0c0c;--papel:#e8e5dd;--gris:#9a968c}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--tinta);color:var(--papel);font-family:Georgia,serif}
.cab{height:52px;display:flex;align-items:center;gap:20px;padding:0 30px;border-bottom:1px solid rgba(232,229,221,.2)}
.cab b{font-weight:400;letter-spacing:.3em}.cab button{background:none;border:0;color:var(--gris);font:10px Georgia;letter-spacing:.18em;cursor:pointer}
.cab button.on{color:var(--papel);border-bottom:2px solid var(--papel)}
.vista{display:none;height:calc(100vh - 52px - 70px);overflow:auto;padding:34px 44px}.vista.on{display:block}
/* HOME: pincelada gigante */
.pincel{min-height:70vh;display:flex;align-items:center;gap:50px}
.trazo{width:130px;height:340px;background:linear-gradient(180deg,transparent,#e8e5dd 18%,#e8e5dd 82%,transparent);border-radius:50% 45% 52% 48%/12% 10% 14% 12%;transform:rotate(6deg);box-shadow:0 0 40px rgba(232,229,221,.1)}
.pincel h1{font-size:64px;font-weight:400;line-height:1;margin:12px 0}.pincel p{max-width:400px;line-height:1.9;color:var(--gris)}
/* LIBRARY: filas como trazos de tinta */
.tit{display:flex;justify-content:space-between;border-bottom:1px solid rgba(232,229,221,.3);padding-bottom:12px;margin-bottom:20px}
.tit h1{font-size:40px;font-weight:400;margin:6px 0}
.filtros{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.filtros button{border:1px solid rgba(232,229,221,.25);background:transparent;color:var(--gris);padding:6px 12px;font:10px Georgia;cursor:pointer}
.filtros button.on{background:var(--papel);color:var(--tinta)}
.lista{border-top:1px solid rgba(232,229,221,.25)}
.fila{display:grid;grid-template-columns:50px 1fr 1fr 74px;align-items:center;padding:15px 8px;border-bottom:1px solid rgba(232,229,221,.14)}
.fila .n{font:11px Georgia;color:var(--gris)}.fila .t{font-size:21px}.fila .a{font:10px Georgia;color:var(--gris)}.fila .d{text-align:right;font:10px Georgia}
.fila:hover{background:rgba(232,229,221,.05)}
.repro{position:fixed;bottom:0;left:0;right:0;height:70px;border-top:1px solid rgba(232,229,221,.2);display:flex;align-items:center;padding:0 30px;background:#080808}
.repro button{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--papel);background:transparent;color:var(--papel);cursor:pointer}
</style></head><body>
<div class="cab"><b>墨 · SAKURA</b><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></div>
<section class="vista on" id="home"><div class="pincel"><div class="trazo"></div><div><p style="font:10px Georgia;letter-spacing:.3em;color:var(--gris)">SUMI · INK</p><h1>La tinta lo dice todo</h1><p>Una sola pincelada basta. Tu música en blanco y negro, sin adornos que la aparten.</p><p style="color:var(--papel)">Abrir biblioteca →</p></div></div></section>
<section class="vista" id="lib"><div class="tit"><div><small style="font:10px Georgia;letter-spacing:.2em;color:var(--gris)">01 · COLECCIÓN</small><h1>Biblioteca</h1></div><span>8 piezas</span></div>
<div class="filtros"><button class="on">Todas juntas</button><button>◀ Subir</button><button>＋ Elegir carpeta</button><button>trazo · 3</button></div>
<div class="lista" id="l"></div></section>
<div class="repro"><span style="color:var(--gris);font-size:11px">Sin pista seleccionada</span><button>▶</button></div>
<script>
document.getElementById('l').innerHTML=Array.from({length:8},(_,i)=>`<div class="fila"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">Pista ${i}</span><span class="a">Artista ${i} · Álbum ${i}</span><span class="d">3:20</span></div>`).join('');
document.querySelectorAll('.cab button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.cab button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
