<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · Swiss Minimal</title><style>
:root{--b:#f2f2f0;--n:#111;--g:#777}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--b);color:var(--n);font-family:Helvetica,Arial,sans-serif}
.cab{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--n)}
.cab b{font-weight:700;letter-spacing:-.02em;font-size:15px}
.cab button{border:0;background:transparent;font:10px Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;padding:8px 10px}
.cab button.on{background:var(--n);color:#fff}
.vista{display:none;height:calc(100vh - 54px - 68px);overflow:auto;padding:0}.vista.on{display:block}
/* HOME: retícula 12 columnas con número gigante */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:0;min-height:74vh}
.num{grid-column:1/6;border-right:1px solid var(--n);display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:700;line-height:1;letter-spacing:-.08em}
.tx{grid-column:6/13;padding:50px 40px;display:flex;flex-direction:column;justify-content:center}
.tx .k{font:10px Helvetica,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.tx h1{font-size:62px;line-height:.95;letter-spacing:-.05em;margin:18px 0 22px;font-weight:700}
.tx p{max-width:380px;line-height:1.6;color:var(--g)}
.tx .b{margin-top:24px;border:1px solid var(--n);padding:11px 16px;width:max-content;font:10px Helvetica;text-transform:uppercase;letter-spacing:.12em;cursor:pointer}
/* LIBRARY: tabla suiza, sin ornamento */
.tit{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:2px solid var(--n);padding:20px 30px}
.tit .k{grid-column:1/7;font:10px Helvetica;text-transform:uppercase;letter-spacing:.2em}
.tit h1{grid-column:7/13;font-size:40px;margin:0;text-align:right;letter-spacing:-.04em}
.filtros{display:flex;gap:0;border-bottom:1px solid var(--n)}
.filtros span{padding:9px 18px;border-right:1px solid var(--n);font:10px Helvetica;text-transform:uppercase;letter-spacing:.1em}
.tabla{border-bottom:1px solid var(--n)}
.f{display:grid;grid-template-columns:80px 1fr 1fr 120px;border-bottom:1px solid #ddd;align-items:center}
.f>div{padding:12px 18px;border-right:1px solid #ddd;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f>div:last-child{border:0}.f.cab{font:9px Helvetica;text-transform:uppercase;letter-spacing:.14em;background:#fff}
.f .t{font-weight:700;font-size:15px}.f:hover{background:#fff}
.repro{height:68px;border-top:1px solid var(--n);display:flex;align-items:center;padding:0 30px}
.repro button{margin-left:auto;border:1px solid var(--n);background:var(--n);color:#fff;width:34px;height:34px;cursor:pointer}
</style></head><body>
<div class="cab"><b>＋ SAKURA</b><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></div>
<section class="vista on" id="home"><div class="grid"><div class="num">01</div><div class="tx"><span class="k">Swiss · Minimal</span><h1>Música sin ruido</h1><p>Lo esencial. Cuadrícula, tipografía y tu colección. Nada más, nada menos.</p><span class="b">Abrir biblioteca →</span></div></div></section>
<section class="vista" id="lib"><div class="tit"><span class="k">Colección / 01</span><h1>Biblioteca</h1></div>
<div class="filtros"><span>Todas juntas</span><span>＋ Elegir carpeta</span><span>Grupo A · 3</span><span>Grupo B · 3</span></div>
<div class="tabla"><div class="f cab"><div>Nº</div><div>TÍTULO</div><div>ARTISTA</div><div>DURACIÓN</div></div><div id="f"></div></div></section>
<div class="repro"><span style="font:11px Helvetica;color:var(--g)">Sin pista seleccionada</span><button>▶</button></div>
<script>
document.getElementById('f').innerHTML=Array.from({length:8},(_,i)=>`<div class="f"><div>${String(i+1).padStart(2,'0')}</div><div class="t">Pista ${i}</div><div>Artista ${i}</div><div>3:20</div></div>`).join('');
document.querySelectorAll('.cab button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.cab button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
