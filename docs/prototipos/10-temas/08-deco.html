<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Art Deco</title><style>
:root{--n:#100e0c;--o:#c9a227;--h:#f0e4c8}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--n);color:var(--h);font-family:Georgia,serif;
 background-image:repeating-linear-gradient(45deg,rgba(201,162,39,.035) 0 2px,transparent 2px 18px)}
.cab{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:2px solid var(--o)}
.cab b{font-weight:400;letter-spacing:.3em;color:var(--o)}
.cab button{background:none;border:1px solid rgba(201,162,39,.3);color:var(--o);padding:6px 14px;font:10px "Courier New",monospace;letter-spacing:.16em;cursor:pointer}
.vista{display:none;height:calc(100vh - 56px - 76px);overflow:auto;padding:32px 44px}.vista.on{display:block}
/* HOME: emblema simétrico con rayos */
.emblema{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sol{width:180px;height:180px;border:2px solid var(--o);border-radius:50%;display:grid;place-items:center;position:relative}
.sol::before{content:'';position:absolute;inset:-24px;border:1px solid rgba(201,162,39,.4);border-radius:50%}
.sol span{font-size:64px;color:var(--o)}
.emblema h1{font-size:44px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;margin:26px 0 8px}
.emblema p{max-width:420px;color:#b8a888;letter-spacing:.08em}
.emblema .boton{border:1px solid var(--o);color:var(--o);padding:10px 18px;font:10px "Courier New",monospace;letter-spacing:.18em;margin-top:16px}
/* LIBRARY: tabla ornamentada */
.tit{text-align:center;border-bottom:2px solid var(--o);padding-bottom:14px;margin-bottom:24px}
.tit small{font:10px "Courier New",monospace;letter-spacing:.3em;color:var(--o)}
.tit h1{font-size:38px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;margin:8px 0}
.tabla{border:2px solid var(--o);outline:1px solid rgba(201,162,39,.3);outline-offset:-6px}
.r{display:grid;grid-template-columns:50px 1fr 1fr 70px;border-bottom:1px solid rgba(201,162,39,.3)}
.r:last-child{border:0}.r>div{padding:12px 14px;border-right:1px solid rgba(201,162,39,.25);font:11px "Courier New",monospace;letter-spacing:.1em}
.r>div:last-child{border:0}.r.cab{background:rgba(201,162,39,.12);color:var(--o)}
.repro{height:76px;border-top:2px solid var(--o);display:flex;align-items:center;padding:0 34px}
.repro button{margin-left:auto;border:1px solid var(--o);background:transparent;color:var(--o);width:38px;height:38px}
</style></head><body>
<div class="cab"><b>◈ SAKURA</b><button data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></div>
<section class="vista on" id="home"><div class="emblema"><div class="sol"><span>桜</span></div><p style="font:10px 'Courier New',monospace;letter-spacing:.4em;color:var(--o)">ART DECO</p><h1>La música es geometría</h1><p>Simetría, orden y brillo. Tu colección dispuesta como una pieza de época.</p><span class="boton">ABRIR BIBLIOTECA →</span></div></section>
<section class="vista" id="lib"><div class="tit"><small>COLECCIÓN · 01</small><h1>Biblioteca</h1></div>
<div class="tabla"><div class="r cab"><div>#</div><div>TÍTULO</div><div>ARTISTA</div><div>TIEMPO</div></div><div id="d"></div></div></section>
<div class="repro"><span style="color:#b8a888;font:11px 'Courier New',monospace">SIN PISTA SELECCIONADA</span><button>▶</button></div>
<script>
document.getElementById('d').innerHTML=Array.from({length:8},(_,i)=>`<div class="r"><div>${String(i+1).padStart(2,'0')}</div><div>PISTA ${i}</div><div>ARTISTA ${i}</div><div>3:20</div></div>`).join('');
document.querySelectorAll('.cab button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.cab button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
