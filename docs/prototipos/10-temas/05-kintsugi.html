<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · Kintsugi</title><style>
:root{--negro:#0d0b0a;--ceramica:#1c1815;--oro:#d4af37;--hueso:#ece0c7}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--negro);color:var(--hueso);font-family:Georgia,serif}
.grieta{position:fixed;inset:0;pointer-events:none;opacity:.12;background:linear-gradient(118deg,transparent 46%,var(--oro) 46.3%,transparent 46.6%),linear-gradient(72deg,transparent 70%,var(--oro) 70.2%,transparent 70.5%)}
.cab{position:relative;height:52px;display:flex;align-items:center;gap:28px;padding:0 30px;border-bottom:1px solid rgba(212,175,55,.3)}
.cab b{font-weight:400;letter-spacing:.22em;color:var(--oro)}
.cab button{background:none;border:0;color:#9c8e70;font:10px Georgia;letter-spacing:.16em;cursor:pointer}
.cab button.on{color:var(--oro)}
.vista{position:relative;display:none;height:calc(100vh - 52px - 72px);overflow:auto;padding:36px 44px}.vista.on{display:block}
/* HOME: medallón central con grietas */
.medallon{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.disco{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2e2822,#141110);border:1px solid rgba(212,175,55,.5);position:relative;display:grid;place-items:center}
.disco::before,.disco::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 47%,var(--oro) 47.5%,transparent 48%),linear-gradient(58deg,transparent 65%,var(--oro) 65.5%,transparent 66%)}
.disco b{font-size:56px;font-weight:400;color:var(--oro)}
.medallon h1{font-size:48px;font-weight:400;margin:28px 0 8px}.medallon p{max-width:400px;color:#9c8e70;line-height:1.9}
/* LIBRARY: filas con costura de oro */
.t{display:flex;justify-content:space-between;border-bottom:1px solid rgba(212,175,55,.4);padding-bottom:12px;margin-bottom:0}
.t h1{font-size:38px;font-weight:400;margin:6px 0}.t small{font:10px Georgia;letter-spacing:.2em;color:var(--oro)}
.lista{margin-top:24px}
.f{display:grid;grid-template-columns:44px 1fr 1fr 60px;align-items:center;gap:10px;padding:14px 8px;border-bottom:1px solid rgba(212,175,55,.18);position:relative}
.f::after{content:'';position:absolute;left:0;bottom:-1px;width:26px;height:1px;background:var(--oro)}
.f .n{font:11px Georgia;color:var(--oro)}.f .tit{font-size:19px}.f .art{font:10px Georgia;color:#9c8e70}.f .d{text-align:right;font:10px Georgia;color:var(--oro)}
.repro{position:fixed;bottom:0;left:0;right:0;height:72px;border-top:1px solid rgba(212,175,55,.3);display:flex;align-items:center;padding:0 30px;background:#0a0807}
.repro button{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--oro);background:transparent;color:var(--oro);cursor:pointer}
</style></head><body><div class="grieta"></div>
<div class="cab"><b>金 · SAKURA</b><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></div>
<section class="vista on" id="home"><div class="medallon"><div class="disco"><b>金</b></div><p style="font:10px Georgia;letter-spacing:.3em;color:var(--oro)">KINTSUGI</p><h1>Lo roto también brilla</h1><p>Cada pista guarda su historia. Las grietas de oro no se ocultan: se celebran.</p><p style="color:var(--oro)">Abrir biblioteca →</p></div></section>
<section class="vista" id="lib"><div class="t"><div><small>01 · COLECCIÓN</small><h1>Biblioteca</h1></div><small>Todas juntas · ＋ carpeta</small></div>
<div class="lista" id="l"></div></section>
<div class="repro"><span style="color:#9c8e70;font-size:11px">Sin pista seleccionada</span><button>▶</button></div>
<script>
document.getElementById('l').innerHTML=Array.from({length:8},(_,i)=>`<div class="f"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="tit">Pista ${i}</span><span class="art">Artista ${i} · Álbum ${i}</span><span class="d">3:20</span></div>`).join('');
document.querySelectorAll('.cab button[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));document.getElementById(b.dataset.v).classList.add('on');document.querySelectorAll('.cab button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
</script></body></html>
