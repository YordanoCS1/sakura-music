<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sakura · vistas desde el árbol y la flor</title>
    <style>
      @font-face { font-family: 'Cormorant'; src: url('../../../public/fonts/cormorant-garamond-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Jakarta'; src: url('../../../public/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Mono'; src: url('../../../public/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
      :root { --ui-bg: #f6f4f7; --ui-ink: #2a2230; --ui-line: #e4dfe8; --accent: #e54d86; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ui-bg); color: var(--ui-ink); font: 14px/1.5 Jakarta, system-ui, sans-serif; }
      header { max-width: 1280px; margin: 0 auto; padding: 24px 30px 0; }
      h1 { margin: 0 0 4px; font: 400 32px/1.1 Cormorant, serif; }
      header p { margin: 0 0 18px; color: #7c7180; font-size: 13px; }
      .controles { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin-bottom: 18px; }
      .grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .grupo > span { font: 10px Mono, monospace; letter-spacing: .14em; color: #7c7180; text-transform: uppercase; }
      button { font: inherit; cursor: pointer; }
      .tabs button, .paletas button, .anchos button { border: 1px solid var(--ui-line); background: #fff; color: var(--ui-ink); padding: 7px 13px; border-radius: 999px; font-size: 12px; }
      .tabs button[aria-selected='true'], .anchos button[aria-selected='true'] { background: #2a2230; border-color: #2a2230; color: #fff; }
      .paletas button { width: 26px; height: 26px; padding: 0; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--ui-line); }
      .paletas button[aria-selected='true'] { box-shadow: 0 0 0 2px var(--ui-ink); }
      .marco { max-width: 1280px; margin: 0 auto; padding: 0 30px; overflow-x: auto; }
      .lienzo { --ancho: 1200px; inline-size: var(--ancho); block-size: 760px; border-radius: 20px; overflow: hidden; container: lienzo / inline-size; background: var(--bg); color: var(--ink); box-shadow: 0 30px 70px rgba(42,34,48,.16); }
      .vista { inline-size: 100%; block-size: 100%; padding: 30px 34px; overflow-y: auto; scrollbar-gutter: stable; position: relative; }
      .kicker { font: 10px Mono, monospace; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
      .vista h2 { margin: 0; font: 400 clamp(26px, 3cqi, 40px)/1.05 Cormorant, serif; }
      .cabecera { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }

      /* Flor reutilizable: cinco pétalos + carátula en el centro. */
      .flor { --size: 84px; position: relative; inline-size: var(--size); block-size: var(--size); flex: none; }
      .flor i { position: absolute; left: 50%; top: 50%; inline-size: 44%; block-size: 62%; margin: -31% 0 0 -22%; border-radius: 50% 50% 45% 45%; background: linear-gradient(160deg, var(--p1), var(--p2)); transform-origin: 50% 100%; }
      .flor i:nth-child(1) { transform: rotate(0deg); }
      .flor i:nth-child(2) { transform: rotate(72deg); }
      .flor i:nth-child(3) { transform: rotate(144deg); }
      .flor i:nth-child(4) { transform: rotate(216deg); }
      .flor i:nth-child(5) { transform: rotate(288deg); }
      .flor .centro { position: absolute; inset: 23%; z-index: 1; border-radius: 50%; background: linear-gradient(145deg, var(--cover-a), var(--cover-b)); border: 3px solid rgba(255,255,255,.9); display: grid; place-items: center; color: #fff; font: 18px Cormorant, serif; box-shadow: 0 6px 16px rgba(80,20,50,.2); }
      .etiqueta strong { display: block; font: 19px Cormorant, serif; }
      .etiqueta small { color: var(--muted); font-size: 11px; }
      .nodo .etiqueta { margin-block-start: 26px; padding: 4px 9px; border-radius: 10px; background: color-mix(in srgb, var(--surface) 86%, transparent); }

      /* 1 · RAMIFICACIONES */
      .ramas .escena { position: relative; block-size: 570px; }
      .ramas svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
      .ramas .trazo { fill: none; stroke: var(--rama); stroke-width: 3; stroke-linecap: round; }
      .ramas .nodo { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 8px; }
      .ramas .nodo .flor { --size: 78px; }
      .ramas .nodo .etiqueta { text-align: center; }
      .ramas .raiz { position: absolute; inset-inline-start: 10px; inset-block-start: 255px; font: 13px Cormorant, serif; color: var(--muted); writing-mode: vertical-rl; }

      /* 2 · ESPiral ÁUREA */
      .espiral .escena { position: relative; block-size: 570px; border-radius: 20px; background: radial-gradient(circle at 50% 48%, var(--soft), transparent 66%); }
      .espiral .nodo { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; }
      .espiral .nodo .flor { --size: 70px; }
      .espiral .nodo .etiqueta { text-align: center; font-size: 10px; white-space: nowrap; }
      .espiral .nodo .etiqueta strong { font-size: 14px; }
      .espiral .semilla { position: absolute; left: 50%; top: 48%; transform: translate(-50%,-50%); inline-size: 110px; block-size: 110px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); font: 12px Mono, monospace; color: var(--muted); text-align: center; }

      /* 3 · COPA / CANOPEA */
      .copa .escena { position: relative; block-size: 570px; border-radius: 20px; background: radial-gradient(circle at 50% 42%, var(--soft), var(--bg) 70%); overflow: clip; }
      .copa svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
      .copa .trazo { fill: none; stroke: var(--rama); stroke-width: 3; stroke-linecap: round; }
      .copa .nodo { position: absolute; transform: translate(-50%,-50%); display: grid; justify-items: center; }
      .copa .nodo .flor { --size: 84px; }
      .copa .nodo .etiqueta { text-align: center; }
      .copa .tronco { position: absolute; left: 50%; bottom: 0; width: 90px; height: 150px; transform: translateX(-50%); background: linear-gradient(90deg, var(--rama), var(--surface), var(--rama)); border-radius: 40px 40px 0 0; opacity: .55; }

      /* 4 · HERBARIO */
      .herbario .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .herbario .especimen { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; grid-template-columns: 88px 1fr; gap: 18px; align-items: center; position: relative; }
      .herbario .especimen::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 11px; pointer-events: none; }
      .herbario .especimen .flor { --size: 84px; filter: saturate(.75); }
      .herbario .especimen .num { position: absolute; inset-block-start: 10px; inset-inline-end: 14px; font: 10px Mono, monospace; color: var(--muted); }
      .herbario .placa { border-block-start: 1px solid var(--line); padding-block-start: 8px; margin-block-start: 8px; font: 10px Mono, monospace; color: var(--muted); }
      @container lienzo (max-width: 980px) { .herbario .grid { grid-template-columns: repeat(2, 1fr); } }

      /* 5 · RAMILLETE */
      .ramillete .escena { position: relative; block-size: 570px; border-radius: 20px; background: linear-gradient(160deg, var(--soft), var(--bg)); }
      .ramillete .nodo { position: absolute; transform: translate(-50%,-50%) rotate(var(--gir, 0deg)); display: grid; justify-items: center; }
      .ramillete .nodo .flor { --size: 150px; }
      .ramillete .nodo .etiqueta { text-align: center; margin-block-start: 6px; }
      .ramillete .tallo { position: absolute; inset-inline-start: 50%; inset-block-end: -40px; inline-size: 4px; block-size: 360px; background: var(--rama); transform: translateX(-50%) rotate(-8deg); transform-origin: bottom; border-radius: 4px; }

      /* 6 · ANILLOS DE CRECIMIENTO */
      .anillos .escena { position: relative; block-size: 570px; }
      .anillos svg { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
      .anillos .anillo { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 7; }
      .anillos .nodo { position: absolute; transform: translate(-50%,-50%); display: grid; justify-items: center; }
      .anillos .nodo .flor { --size: 64px; }
      .anillos .nodo .etiqueta { text-align: center; }
      .anillos .centro-tronco { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); inline-size: 96px; block-size: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font: 11px Mono, monospace; text-align: center; color: var(--muted); }

      .nota { max-width: 1200px; margin: 18px auto 40px; padding: 16px 20px; background: #fff; border-radius: 12px; border-left: 4px solid var(--accent); }
      .nota h3 { margin: 0 0 5px; font: 600 18px Cormorant, serif; }
      .nota p { margin: 0; color: #5f5563; }
      .nota small { display: block; margin-top: 6px; color: #8c8390; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sakura · vistas desde el árbol y la flor</h1>
      <p>La estructura nace del cerezo: ramas, corola, copa, herbario, ramo y anillos. Cambiá tema y ancho para ver cómo se adaptan.</p>
      <div class="controles">
        <div class="grupo"><span>Vista</span><div class="tabs" id="tabs" role="tablist"></div></div>
        <div class="grupo"><span>Tema</span><div class="paletas" id="paletas"></div></div>
        <div class="grupo"><span>Ancho</span><div class="anchos" id="anchos"></div></div>
      </div>
    </header>
    <div class="marco"><div class="lienzo" id="lienzo"><div class="vista" id="vista"></div></div></div>
    <div class="nota"><h3 id="titulo"></h3><p id="descripcion"></p><small id="detalle"></small></div>

    <script>
      const tracks = [
        ['Gurenge', 'LiSA', '3:20'], ['Lilac', 'Queen', '4:02'], ['Kaze', 'Sakura', '2:58'],
        ['Aoi', 'Aimer', '3:41'], ['Hana', 'Kenshi', '3:12'], ['Yuki', 'YUI', '4:18'], ['Nagori', 'Ado', '3:36'],
      ];
      const paletas = {
        Sakura: { bg: '#fff6f9', surface: '#fff', soft: '#ffe3ee', line: '#f0d9e3', ink: '#3d1626', muted: '#9a6a7d', accent: '#e54d86', p1: '#ffd6e6', p2: '#ff6fa4', coverA: '#ffb3ce', coverB: '#d6306c', rama: '#8c5a6d' },
        Loto: { bg: '#f7eddb', surface: '#fffaf0', soft: '#f0dcb6', line: '#e4d3b2', ink: '#3a120f', muted: '#8a6a2f', accent: '#b93829', p1: '#f1d994', p2: '#c98b3a', coverA: '#f1d994', coverB: '#8a3d22', rama: '#7a5a24' },
        'La Gran Ola': { bg: '#f3e9d4', surface: '#fffaf0', soft: '#dbe8f2', line: '#dccdb4', ink: '#0d2138', muted: '#46617d', accent: '#163a5f', p1: '#cfe3f2', p2: '#6f9dc4', coverA: '#9fc4e0', coverB: '#163a5f', rama: '#46617d' },
        Vinilo: { bg: '#151210', surface: '#231e1a', soft: '#3a2820', line: '#3d352d', ink: '#f0e5dc', muted: '#a99a8d', accent: '#ff5e3a', p1: '#ff9a76', p2: '#b13b1d', coverA: '#ff8a63', coverB: '#6d2a17', rama: '#7a5a45' },
        Karesansui: { bg: '#eeeadf', surface: '#fffdf8', soft: '#dfd8ca', line: '#d8d2c6', ink: '#2b2721', muted: '#7c756a', accent: '#3c332a', p1: '#d8d2c6', p2: '#9c9689', coverA: '#c7c0ae', coverB: '#6b655b', rama: '#8a8376' },
      };
      const anchos = [1200, 1000, 820];

      const flor = () => `<div class="flor"><i></i><i></i><i></i><i></i><i></i><span class="centro">桜</span></div>`;
      const etiqueta = ([t, a, d]) => `<div class="etiqueta"><strong>${t}</strong><small>${a} · ${d}</small></div>`;
      const nodo = (x, y, i, extra = '') => `<div class="nodo" style="left:${(x / 1140 * 100).toFixed(2)}%;top:${(y / 570 * 100).toFixed(2)}%;${extra}">${flor()}${etiqueta(tracks[i])}</div>`;
      const cab = (kicker, titulo, der) => `<div class="cabecera"><div><span class="kicker">${kicker}</span><h2>${titulo}</h2></div><span class="kicker">${der}</span></div>`;

      // 1 · Ramificaciones: nodos en dos alturas alternas, unidos por curvas.
      const ptsRamas = tracks.map((_, i) => ({ x: 190 + i * 133, y: 290 + (i % 2 ? 150 : -120) }));
      const pathsRamas = ptsRamas.slice(1).map((p, i) => {
        const a = ptsRamas[i];
        return `<path class="trazo" d="M ${a.x} ${a.y} Q ${(a.x + p.x) / 2} ${(a.y + p.y) / 2 + 40} ${p.x} ${p.y}"/>`;
      }).join('') + `<path class="trazo" d="M 70 285 Q 120 285 ${ptsRamas[0].x} ${ptsRamas[0].y}"/>`;

      // 2 · Espiral áurea: ángulo 137,5° y radio proporcional a sqrt(i).
      const ptsEspiral = tracks.map((_, i) => {
        const ang = (i * 137.5 * Math.PI) / 180;
        const r = 55 + 78 * Math.sqrt(i);
        return { x: 570 + r * Math.cos(ang), y: 285 + r * Math.sin(ang) };
      });

      // 3 · Copa: radial desde el centro.
      const ptsCopa = tracks.map((_, i) => {
        const ang = (-90 + i * 51) * Math.PI / 180;
        const r = 250 + (i % 2) * 60;
        return {
          x: 570 + r * Math.cos(ang),
          y: Math.max(100, Math.min(470, 270 + r * Math.sin(ang))),
        };
      });
      const rayosCopa = ptsCopa.map((p) => `<path class="trazo" d="M 570 270 Q 570 ${p.y - 40} ${p.x} ${p.y}"/>`).join('');

      // 6 · Anillos: tres niveles concéntricos.
      const ptsAnillos = [
        { x: 420, y: 190 }, { x: 720, y: 190 }, { x: 570, y: 430 },
        { x: 300, y: 300 }, { x: 840, y: 300 }, { x: 800, y: 480 }, { x: 570, y: 95 },
      ];
      const circAnillos = [150, 280, 410].map((r) => `<circle class="anillo" cx="570" cy="285" r="${r}"/>`).join('');

      const herbario = tracks.map(([t, a, d], i) => `
        <article class="especimen"><span class="num">ESP. ${String(i + 1).padStart(2, '0')}</span>
          ${flor()}<div class="etiqueta"><strong>${t}</strong><small>${a} · ${d}</small>
          <div class="placa">PRUNUS · CULTIVO LOCAL</div></div></article>`).join('');

      const ramillete = [
        [570, 250, 0, -10], [410, 200, 1, 8], [720, 195, 2, -6],
        [350, 350, 3, 12], [600, 370, 4, -8], [810, 350, 5, 10], [490, 420, 6, -4],
      ].map(([x, y, i, g]) => nodo(x, y, i, `--gir:${g}deg`)).join('');

      const disenos = [
        {
          id: 'ramas', nombre: 'Ramificaciones', titulo: '1 · Ramificaciones',
          desc: 'La biblioteca crece como un árbol: un tronco se abre en ramas y cada punta sostiene una flor con su carátula.',
          detalle: 'La jerarquía es la estructura: las curvas unen pistas, no una grilla. Cada flor es un nodo reproducible con los mismos cinco pétalos.',
          html: `${cab('El cerezo', 'Biblioteca en ramas', `${tracks.length} flores`)}<div class="escena"><svg viewBox="0 0 1140 570">${pathsRamas}</svg><div class="raiz">桜 · SAKURA</div>${ptsRamas.map((p, i) => nodo(p.x, p.y, i)).join('')}</div>`,
        },
        {
          id: 'espiral', nombre: 'Corola áurea', titulo: '2 · Corola áurea',
          desc: 'Las flores se disponen con el ángulo áureo (137,5°), como crecen las semillas de un girasol: ninguna se repite ni se alinea.',
          detalle: 'Posición generada por matemáticas, no por columnas. El centro representa el tronco y cada flor se aleja al ritmo de raíz cuadrada.',
          html: `${cab('Geometría floral', 'Corola en espiral', `${tracks.length} pistas`)}<div class="escena"><div class="semilla">TRONCO<br>桜</div>${ptsEspiral.map((p, i) => nodo(p.x, p.y, i)).join('')}</div>`,
        },
        {
          id: 'copa', nombre: 'Copa / canopea', titulo: '3 · Copa del cerezo',
          desc: 'Vista desde debajo del árbol: las ramas irradian desde el tronco y las flores cuelgan en la copa, con el cielo al fondo.',
          detalle: 'Composición radial con líneas orgánicas. El espacio entre flores es parte del diseño; la lectura es periférica, no tabular.',
          html: `${cab('Bajo la copa', 'Cielos de sakura', `${tracks.length} ramas`)}<div class="escena"><div class="tronco"></div><svg viewBox="0 0 1140 570">${rayosCopa}</svg>${ptsCopa.map((p, i) => nodo(p.x, p.y, i)).join('')}</div>`,
        },
        {
          id: 'herbario', nombre: 'Herbario vivo', titulo: '4 · Herbario vivo',
          desc: 'Cada pista es un espécimen prensado: cinco pétalos, carátula en el centro y una placa de catalogación botánica.',
          detalle: 'Estructura de museo, no de catálogo comercial. La flor se mantiene recognizable aunque se reduzca: la forma comunica antes que el texto.',
          html: `${cab('Colección botánica', 'Herbario de sakura', `PRUNUS · ${tracks.length} especímenes`)}<div class="grid">${herbario}</div>`,
        },
        {
          id: 'ramillete', nombre: 'Ramillete', titulo: '5 · Ramillete',
          desc: 'Un ramo real: flores grandes que se superponen, se inclinan y comparten un mismo tallo, con profundidad en vez de columnas.',
          detalle: 'La superposición crea jerarquía por z-index y rotación. Cada flor conserva su carátula y su etiqueta aunque esté parcialmente tapada.',
          html: `${cab('Ramón de flores', 'Ramillete de sakura', `${tracks.length} flores`)}<div class="escena"><div class="tallo"></div>${ramillete}</div>`,
        },
        {
          id: 'anillos', nombre: 'Anillos de crecimiento', titulo: '6 · Anillos de crecimiento',
          desc: 'La biblioteca se lee como el tronco cortado de un cerezo: anillos concéntricos por álbum y flores sobre cada anillo.',
          detalle: 'La distancia al centro indica antigüedad; cada pista queda sobre su anillo. Es una vista de datos con forma orgánica.',
          html: `${cab('Historial del árbol', 'Anillos de crecimiento', '3 álbumes')}<div class="escena"><svg viewBox="0 0 1140 570">${circAnillos}</svg><div class="centro-tronco">NÚCLEO<br>桜</div>${ptsAnillos.map((p, i) => nodo(p.x, p.y, i)).join('')}</div>`,
        },
      ];

      const tabs = document.getElementById('tabs');
      const paletasEl = document.getElementById('paletas');
      const anchosEl = document.getElementById('anchos');
      const lienzo = document.getElementById('lienzo');
      const vista = document.getElementById('vista');
      const titulo = document.getElementById('titulo');
      const descripcion = document.getElementById('descripcion');
      const detalle = document.getElementById('detalle');
      let paletaActual = 'Sakura';

      function aplicarPaleta() {
        const p = paletas[paletaActual];
        for (const [clave, valor] of Object.entries(p)) {
          lienzo.style.setProperty(`--${clave}`, valor);
        }
        document.documentElement.style.setProperty('--accent', p.accent);
        [...paletasEl.children].forEach((b) => b.setAttribute('aria-selected', String(b.dataset.nombre === paletaActual)));
      }
      function mostrar(i) {
        const d = disenos[i];
        vista.className = `vista ${d.id}`;
        vista.innerHTML = d.html;
        titulo.textContent = d.titulo;
        descripcion.textContent = d.desc;
        detalle.textContent = d.detalle;
        [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', String(i === j)));
      }
      disenos.forEach((d, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.role = 'tab'; b.textContent = d.nombre;
        b.addEventListener('click', () => mostrar(i)); tabs.appendChild(b);
      });
      Object.keys(paletas).forEach((nombre) => {
        const b = document.createElement('button');
        b.type = 'button'; b.title = nombre; b.dataset.nombre = nombre;
        b.style.background = paletas[nombre].accent;
        b.addEventListener('click', () => { paletaActual = nombre; aplicarPaleta(); }); paletasEl.appendChild(b);
      });
      anchos.forEach((ancho) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = `${ancho}px`;
        b.addEventListener('click', () => {
          lienzo.style.setProperty('--ancho', `${ancho}px`);
          [...anchosEl.children].forEach((x) => x.setAttribute('aria-selected', String(x === b)));
        }); anchosEl.appendChild(b);
      });
      aplicarPaleta(); mostrar(0); anchosEl.children[0].setAttribute('aria-selected', 'true');
    </script>
  </body>
</html>
