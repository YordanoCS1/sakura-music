<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sakura · alternativas de biblioteca</title>
    <style>
      @font-face {
        font-family: 'Cormorant';
        src: url('../../../public/fonts/cormorant-garamond-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Mono';
        src: url('../../../public/fonts/jetbrains-mono-latin.woff2') format('woff2');
      }
      :root {
        --rosa: #e54d86;
        --rosa-claro: #ffd6e6;
        --tinta: #3d1626;
        --papel: #fff7fa;
        --oro: #d4af37;
        --foto: url('../../../public/images/sakura-tree.jpg');
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #efe4ea;
        color: var(--tinta);
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      header {
        padding: 22px 30px 0;
        max-width: 1260px;
        margin: 0 auto;
      }
      h1 {
        font: 400 34px/1 Cormorant, Georgia, serif;
        margin: 0 0 6px;
      }
      header p { margin: 0 0 16px; color: #7a3b52; }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .tabs button {
        border: 1px solid rgba(229, 77, 134, 0.35);
        background: rgba(255, 255, 255, 0.7);
        color: #7a3b52;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .tabs button[aria-selected='true'] {
        background: var(--rosa);
        border-color: var(--rosa);
        color: #fff;
      }
      .marco { padding: 0 30px 30px; max-width: 1260px; margin: 0 auto; }
      .lienzo {
        width: 1200px;
        height: 750px;
        overflow: hidden;
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(80, 25, 50, 0.18);
        position: relative;
        background: var(--papel);
      }
      .nota {
        max-width: 1200px;
        margin: 16px auto 40px;
        padding: 16px 20px;
        background: #fff;
        border-radius: 12px;
        border-left: 4px solid var(--rosa);
      }
      .nota h2 { margin: 0 0 6px; font: 600 18px Cormorant, serif; }
      .nota p { margin: 0; color: #6b3b4e; }
      .nota small { display: block; margin-top: 8px; color: #9a6a7d; }

      /* ── A · PERGAMINO COLGANTE ── */
      .pergamino {
        background: linear-gradient(100deg, #3b1a22, #611f30 50%, #2c1119);
        display: grid;
        place-items: center;
      }
      .pergamino::before {
        content: '';
        position: absolute; inset: 0;
        background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 26px);
      }
      .pergamino .rollo {
        width: 620px; height: 690px; position: relative;
        background: #f6e7c9;
        border-left: 10px solid #8a6a2f; border-right: 10px solid #8a6a2f;
        box-shadow: 0 20px 50px rgba(0,0,0,.45);
        padding: 30px 36px;
      }
      .pergamino .rollo::before, .pergamino .rollo::after {
        content: ''; position: absolute; left: -22px; right: -22px; height: 16px;
        background: linear-gradient(180deg,#7a5a24,#d4af37,#7a5a24); border-radius: 8px;
      }
      .pergamino .rollo::before { top: -8px; } .pergamino .rollo::after { bottom: -8px; }
      .pergamino .cab { text-align: center; border-bottom: 2px solid #b93829; padding-bottom: 12px; margin-bottom: 8px; }
      .pergamino .cab b { font: 30px Cormorant, serif; color: #5e1023; display: block; }
      .pergamino .cab small { font: 9px Mono, monospace; letter-spacing: .2em; color: #8a6a2f; }
      .pergamino .fila { display: grid; grid-template-columns: 34px 58px 1fr 52px; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid rgba(138,106,47,.28); }
      .pergamino .num { font: 11px Mono, monospace; color: #b93829; }
      .pergamino .mini { width: 58px; height: 58px; background: radial-gradient(circle at 35% 30%, #ff8fb8, #e54d86 55%, #a8205b); color: #fff; display: grid; place-items: center; font-size: 20px; }
      .pergamino .tit { font: 21px Cormorant, serif; }
      .pergamino .sub { font-size: 11px; color: #7a564a; }
      .pergamino .dur { font: 10px Mono, monospace; color: #8a6a2f; text-align: right; }
      .pergamino .sello { position: absolute; right: 26px; bottom: 18px; width: 44px; height: 44px; border: 3px double #b93829; color: #b93829; display: grid; place-items: center; font-size: 20px; transform: rotate(-8deg); }

      /* ── B · BANDEJAS DE LACA ── */
      .bandejas { background: #f4eee7; padding: 34px 40px; }
      .bandejas .head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #c9b9aa; padding-bottom: 10px; margin-bottom: 24px; }
      .bandejas .head h2 { font: 36px Cormorant, serif; margin: 0; }
      .bandejas .head span { font: 10px Mono, monospace; letter-spacing: .16em; color: #8a7c6d; }
      .bandejas .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .bandeja { background: #24191b; border: 1px solid #6d4a2c; border-radius: 4px; padding: 18px; position: relative; box-shadow: 0 12px 24px rgba(0,0,0,.22); }
      .bandeja::after { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(212,175,55,.28); pointer-events: none; }
      .bandeja .portada { aspect-ratio: 1; background: linear-gradient(145deg,#3a2029,#170d12); display: grid; place-items: center; color: var(--oro); font-size: 34px; border: 1px solid rgba(212,175,55,.4); }
      .bandeja .etiqueta { margin-top: 14px; padding-left: 10px; border-left: 3px solid var(--oro); }
      .bandeja strong { display: block; color: #f0e5dc; font: 20px Cormorant, serif; }
      .bandeja small { color: #a99a8d; font-size: 11px; }

      /* ── C · EDITORIAL HANAMI ── */
      .editorial { background: #fbfaf7; padding: 28px 40px; color: #1a1214; }
      .editorial .mast { border-top: 6px solid #b93829; padding-top: 8px; display: flex; justify-content: space-between; font: 10px Mono, monospace; letter-spacing: .18em; color: #6b5a5c; margin-bottom: 20px; }
      .editorial .cuerpo { display: grid; grid-template-columns: 42% 1fr; gap: 34px; }
      .editorial .destacado .foto { height: 430px; background: var(--foto) center/cover; position: relative; }
      .editorial .destacado .foto::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,240,246,.95), transparent 55%); }
      .editorial .destacado h3 { font: 44px/1 Cormorant, serif; margin: 12px 0 4px; }
      .editorial .destacado p { color: #7a5c6b; font-size: 12px; }
      .editorial .lista .fila { display: grid; grid-template-columns: 44px 1fr 46px; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid #ded6d3; }
      .editorial .lista .mini { width: 44px; height: 44px; background: #e9d7df; color: #b93829; display: grid; place-items: center; font: 18px Cormorant, serif; }
      .editorial .lista strong { font: 20px Cormorant, serif; display: block; }
      .editorial .lista small { color: #8a7c82; font-size: 11px; }
      .editorial .lista .dur { font: 10px Mono, monospace; text-align: right; color: #a4737f; }

      /* ── D · NOCTURNO ── */
      .nocturno { background: radial-gradient(circle at 75% 10%, #3a1b46, #100f26 60%); padding: 34px 40px; }
      .nocturno .head { color: #ffd6e6; font: 34px Cormorant, serif; margin-bottom: 22px; }
      .nocturno .head small { display: block; font: 9px Mono, monospace; letter-spacing: .2em; color: #b78aa8; }
      .nocturno .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .nocturno .tarjeta { border: 1px solid rgba(255,111,164,.35); border-radius: 18px; padding: 18px; background: rgba(255,255,255,.05); color: #fff4f8; box-shadow: 0 0 24px rgba(229,77,134,.12); }
      .nocturno .tarjeta .cir { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff9ec3, #e54d86 60%, #7a1d4a); display: grid; place-items: center; font-size: 26px; box-shadow: 0 0 22px rgba(229,77,134,.5); }
      .nocturno .tarjeta strong { font: 22px Cormorant, serif; display: block; text-align: center; }
      .nocturno .tarjeta small { display: block; text-align: center; color: #c9a8be; font-size: 11px; }

      /* ── E · BANNERS COLGANTES ── */
      .banners { background: linear-gradient(180deg,#ffeaf3,#f6c9dc); padding: 30px 36px; overflow: hidden; }
      .banners .head { font: 30px Cormorant, serif; margin-bottom: 18px; color: #5e1023; }
      .banners .tira { display: flex; gap: 18px; overflow-x: auto; padding-bottom: 10px; }
      .banner { flex: 0 0 176px; height: 520px; background: #fff8fb; border-radius: 4px 4px 18px 18px; overflow: hidden; box-shadow: 0 14px 30px rgba(150,50,90,.2); position: relative; }
      .banner::before { content: ''; position: absolute; left: 50%; top: 0; width: 14px; height: 22px; transform: translateX(-50%); background: #d4af37; border-radius: 0 0 6px 6px; }
      .banner .cinta { height: 210px; background: var(--foto) center 30%/cover; position: relative; }
      .banner .cinta::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,248,251,.9), transparent 60%); }
      .banner .cuerpo { padding: 16px 14px; }
      .banner .jp { writing-mode: vertical-rl; font: 22px Cormorant, serif; height: 170px; color: #b93829; margin-left: auto; }
      .banner strong { display: block; font: 19px Cormorant, serif; margin-top: 10px; }
      .banner small { color: #8a5c74; font-size: 10px; }

      /* ── F · CONSTELACIÓN ── */
      .constelacion { background: #fff5f8; position: relative; }
      .constelacion::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 20%, rgba(229,77,134,.10), transparent 40%), radial-gradient(ellipse at 80% 80%, rgba(212,175,55,.12), transparent 40%); }
      .constelacion .rama { position: absolute; width: 70%; left: 8%; top: 30%; height: 2px; background: linear-gradient(90deg,transparent,#c89aa9,transparent); opacity: .5; transform: rotate(-6deg); }
      .constelacion h2 { position: absolute; left: 44px; top: 34px; font: 38px Cormorant, serif; margin: 0; }
      .constelacion h2 small { display: block; font: 9px Mono, monospace; letter-spacing: .2em; color: #b07e93; }
      .astro { position: absolute; width: 150px; text-align: center; }
      .astro .cir { width: 110px; height: 110px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffd6e6, #ff6fa4 55%, #d6306c); border: 5px solid #fff; box-shadow: 0 10px 26px rgba(214,48,108,.25); display: grid; place-items: center; color: #fff; font-size: 30px; }
      .astro strong { display: block; font: 19px Cormorant, serif; margin-top: 10px; }
      .astro small { color: #9a6a7d; font-size: 10px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sakura · alternativas de biblioteca</h1>
      <p>Seis estructuras distintas con la misma identidad. Elegí una y la implemento en <code>ThemeLibrary.tsx</code>.</p>
      <div class="tabs" id="tabs" role="tablist"></div>
    </header>
    <div class="marco"><div class="lienzo" id="lienzo"></div></div>
    <div class="nota">
      <h2 id="titulo"></h2>
      <p id="descripcion"></p>
      <small id="detalle"></small>
    </div>

    <script>
      const tracks = [
        ['Gurenge', 'LiSA', 'Álbum 0', '3:20'],
        ['Lilac', 'Queen', 'Álbum 1', '4:02'],
        ['Kaze', 'Sakura', 'Álbum 2', '2:58'],
        ['Aoi', 'Aimer', 'Álbum 3', '3:41'],
        ['Hana', 'Kenshi', 'Álbum 4', '3:12'],
        ['Yuki', 'YUI', 'Álbum 5', '4:18'],
      ];

      const filasPerg = tracks.map(([t, a, al, d], i) => `
        <div class="fila">
          <span class="num">${String(i + 1).padStart(2, '0')}</span>
          <span class="mini">桜</span>
          <span><span class="tit">${t}</span><br><span class="sub">${a} · ${al}</span></span>
          <span class="dur">${d}</span>
        </div>`).join('');

      const bandejas = tracks.map(([t, a], i) => `
        <div class="bandeja">
          <div class="portada">桜</div>
          <div class="etiqueta"><strong>${String(i + 1).padStart(2, '0')} · ${t}</strong><small>${a} · 33⅓ RPM</small></div>
        </div>`).join('');

      const filasEditorial = tracks.map(([t, a, al, d], i) => `
        <div class="fila">
          <span class="mini">${i + 1}</span>
          <span><strong>${t}</strong><small>${a} · ${al}</small></span>
          <span class="dur">${d}</span>
        </div>`).join('');

      const tarjetasNocturnas = tracks.map(([t, a]) => `
        <div class="tarjeta"><div class="cir">桜</div><strong>${t}</strong><small>${a}</small></div>`).join('');

      const banners = tracks.map(([t, a], i) => `
        <div class="banner">
          <div class="cinta"></div>
          <div class="cuerpo">
            <span class="jp">桜 ${String(i + 1).padStart(2, '0')}</span>
            <strong>${t}</strong><small>${a} · ${tracks[i][2]}</small>
          </div>
        </div>`).join('');

      const posiciones = [[70, 250], [300, 470], [540, 230], [770, 450], [1000, 240], [920, 590]];
      const astros = tracks.map(([t, a], i) => `
        <div class="astro" style="left:${posiciones[i][0]}px;top:${posiciones[i][1]}px">
          <div class="cir">桜</div><strong>${t}</strong><small>${a}</small>
        </div>`).join('');

      const disenos = [
        {
          id: 'pergamino',
          nombre: 'Pergamino colgante',
          titulo: 'A · Pergamino colgante',
          desc: 'Un rollo de seda suspendido sobre madera oscura. Las pistas se leen como un índice vertical, con número, sello rojo y varillas doradas.',
          detalle: 'Estructura: una sola columna central · Móvil: el scroll, no la grilla · Ideal si querés enfatizar el ritual y la lectura.',
          html: `<div class="pergamino"><div class="rollo">
            <div class="cab"><b>桜 花の索引</b><small>BIBLIOTECA PRIMAVERAL · ${tracks.length} FLORES</small></div>
            ${filasPerg}<div class="sello">蓮</div>
          </div></div>`,
        },
        {
          id: 'bandejas',
          nombre: 'Bandejas de laca',
          titulo: 'B · Bandejas de laca',
          desc: 'Fundas como bandejas de laca sobre una mesa clara. Cada pista es un objeto físico con portada central y etiqueta en oro.',
          detalle: 'Estructura: grilla de 3 columnas · Acento: oro sobre negro · Ideal si buscás una biblioteca objetual y coleccionable.',
          html: `<div class="bandejas"><div class="head"><h2>Fundas de Sakura</h2><span>COLECCIÓN LOCAL · ${tracks.length} PIEZAS</span></div>
            <div class="grid">${bandejas}</div></div>`,
        },
        {
          id: 'editorial',
          nombre: 'Revista hanami',
          titulo: 'C · Revista hanami',
          desc: 'Una portada protagonista a la izquierda y un índice tipográfico a la derecha, con cabecera de publicación y sello rojo.',
          detalle: 'Estructura: dos columnas asimétricas · Foto real integrada · Ideal si querés una vista editorial con mucha jerarquía.',
          html: `<div class="editorial"><div class="mast"><span>SAKURA · EDICIÓN FLORAL</span><span>No 01 · HANAMI</span></div>
            <div class="cuerpo"><div class="destacado"><div class="foto"></div><h3>${tracks[0][0]}</h3><p>${tracks[0][1]} · ${tracks[0][2]} · ${tracks[0][3]}</p></div>
            <div class="lista">${filasEditorial}</div></div></div>`,
        },
        {
          id: 'nocturno',
          nombre: 'Hanami nocturno',
          titulo: 'D · Hanami nocturno',
          desc: 'La misma flora de noche: fondo índigo, pétalos luminosos y tarjetas redondeadas con halo. La portada se vuelve una flor.',
          detalle: 'Estructura: grilla de 3 columnas · Light mode oscuro · Ideal si querés contraste fuerte y presencia visual sin foto de fondo.',
          html: `<div class="nocturno"><div class="head">桜 Bajo la luna<small>HANAMI NOCTURNO · ${tracks.length} PISTAS</small></div>
            <div class="grid">${tarjetasNocturnas}</div></div>`,
        },
        {
          id: 'banners',
          nombre: 'Estandartes colgantes',
          titulo: 'E · Estandartes colgantes',
          desc: 'Cintas estrechas y altas colgadas de una barra dorada, con la foto recortada arriba y el título en vertical.',
          detalle: 'Estructura: tira horizontal desplazable · Lectura vertical · Ideal si querés una galería tipo museo, distinta de cualquier grilla.',
          html: `<div class="banners"><div class="head">桜 Estandartes en flor</div><div class="tira">${banners}</div></div>`,
        },
        {
          id: 'constelacion',
          nombre: 'Constelación de flores',
          titulo: 'F · Constelación de flores',
          desc: 'Portadas circulares flotando en un campo claro, unidas por una rama fina. Espacio, aire y tipografía breve.',
          detalle: 'Estructura: posición libre sobre el lienzo · Muy liviana · Ideal si priorizás calma y velocidad por encima de la densidad.',
          html: `<div class="constelacion"><div class="rama"></div><h2>桜 Jardín de pétalos<small>FLORES EN ÓRBITA · ${tracks.length} PISTAS</small></h2>${astros}</div>`,
        },
      ];

      const tabs = document.getElementById('tabs');
      const lienzo = document.getElementById('lienzo');
      const titulo = document.getElementById('titulo');
      const descripcion = document.getElementById('descripcion');
      const detalle = document.getElementById('detalle');

      function mostrar(indice) {
        const d = disenos[indice];
        lienzo.className = `lienzo ${d.id}`;
        lienzo.innerHTML = d.html;
        titulo.textContent = d.titulo;
        descripcion.textContent = d.desc;
        detalle.textContent = d.detalle;
        [...tabs.children].forEach((b, i) => b.setAttribute('aria-selected', String(i === indice)));
      }

      disenos.forEach((d, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.role = 'tab';
        b.textContent = `${d.nombre}`;
        b.addEventListener('click', () => mostrar(i));
        tabs.appendChild(b);
      });
      mostrar(0);
    </script>
  </body>
</html>
