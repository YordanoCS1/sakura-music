<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca Sakura · maquetas modernas</title>
    <style>
      @font-face { font-family: 'Cormorant'; src: url('../../../public/fonts/cormorant-garamond-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Jakarta'; src: url('../../../public/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Mono'; src: url('../../../public/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
      :root {
        --ui-bg: #f6f4f7;
        --ui-ink: #2a2230;
        --ui-muted: #7c7180;
        --ui-line: #e4dfe8;
        --accent: #e54d86;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ui-bg); color: var(--ui-ink); font: 14px/1.5 Jakarta, system-ui, sans-serif; }
      header { max-width: 1280px; margin: 0 auto; padding: 24px 30px 0; }
      h1 { margin: 0 0 4px; font: 400 32px/1.1 Cormorant, Georgia, serif; }
      header p { margin: 0 0 18px; color: var(--ui-muted); font-size: 13px; }
      .controles { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin-bottom: 18px; }
      .grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .grupo > span { font: 10px Mono, monospace; letter-spacing: .14em; color: var(--ui-muted); text-transform: uppercase; }
      button { font: inherit; cursor: pointer; }
      .tabs button, .paletas button, .anchos button {
        border: 1px solid var(--ui-line); background: #fff; color: var(--ui-ink);
        padding: 7px 13px; border-radius: 999px; font-size: 12px;
      }
      .tabs button[aria-selected='true'], .anchos button[aria-selected='true'] {
        background: #2a2230; border-color: #2a2230; color: #fff;
      }
      .paletas button { width: 26px; height: 26px; padding: 0; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--ui-line); }
      .paletas button[aria-selected='true'] { box-shadow: 0 0 0 2px var(--ui-ink); }
      .marco { max-width: 1280px; margin: 0 auto; padding: 0 30px; overflow-x: auto; }
      .lienzo {
        --ancho: 1200px;
        inline-size: var(--ancho);
        block-size: 760px;
        border-radius: 20px;
        overflow: hidden;
        container: lienzo / inline-size;
        background: var(--bg);
        color: var(--ink);
        box-shadow: 0 30px 70px rgba(42, 34, 48, .16);
        transition: background .2s, color .2s;
      }
      .vista { inline-size: 100%; block-size: 100%; padding: 30px 34px; overflow-y: auto; scrollbar-gutter: stable; }
      .vista h2 { margin: 0; font: 400 clamp(26px, 3cqi, 40px)/1.05 Cormorant, serif; }
      .vista .kicker { font: 10px Mono, monospace; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
      .vista .cabecera { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
      .cover { aspect-ratio: 1; border-radius: 14px; background: linear-gradient(145deg, var(--cover-a), var(--cover-b)); display: grid; place-items: center; color: #fff; font: 28px Cormorant, serif; }
      .nota { max-width: 1200px; margin: 18px auto 40px; padding: 16px 20px; background: #fff; border-radius: 12px; border-left: 4px solid var(--accent); }
      .nota h3 { margin: 0 0 5px; font: 600 18px Cormorant, serif; }
      .nota p { margin: 0; color: #5f5563; }
      .nota small { display: block; margin-top: 6px; color: #8c8390; }

      /* 1 · BENTO */
      .bento .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .bento .hero { grid-column: span 2; grid-row: span 2; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: grid; grid-template-rows: 1fr auto; gap: 10px; }
      .bento .hero .cover { inline-size: 100%; block-size: 100%; min-block-size: 240px; border-radius: 16px; font-size: 70px; }
      .bento .hero h3 { font: 400 clamp(26px, 3.4cqi, 42px)/1 Cormorant, serif; margin: 0; }
      .bento .celda { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 13px; min-inline-size: 0; flex-wrap: wrap; align-content: center; }
      .bento .celda .cover { inline-size: 64px; flex: none; font-size: 22px; }
      .bento .celda strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bento .celda small { color: var(--muted); font-size: 11px; }
      .bento .chip { background: var(--soft); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: 10px Mono, monospace; }
      @container lienzo (max-width: 980px) {
        .bento .grid { grid-template-columns: repeat(2, 1fr); }
        .bento .hero { grid-column: span 2; grid-row: span 1; }
      }

      /* 2 · LISTA DENSA */
      .lista .barra { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .lista .chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 11px; }
      .lista .chip.activo { background: var(--accent); border-color: var(--accent); color: #fff; }
      .lista .fila { display: grid; grid-template-columns: 28px 46px minmax(120px, 1.5fr) minmax(90px, 1fr) 54px 70px; gap: 14px; align-items: center; padding: 9px 12px; border-radius: 12px; }
      .lista .fila:nth-child(odd) { background: var(--surface); }
      .lista .fila.activa { background: var(--soft); }
      .lista .fila .num { font: 11px Mono, monospace; color: var(--muted); }
      .lista .fila .cover { inline-size: 46px; border-radius: 8px; font-size: 16px; }
      .lista .fila strong { display: block; font-size: 13px; }
      .lista .fila small, .lista .fila .album { color: var(--muted); font-size: 11px; }
      .lista .fila .dur { font: 10px Mono, monospace; color: var(--muted); text-align: right; }
      .lista .acc { display: flex; gap: 6px; justify-content: end; }
      .lista .acc i { inline-size: 22px; block-size: 22px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-style: normal; font-size: 11px; }
      @container lienzo (max-width: 980px) {
        .lista .fila { grid-template-columns: 28px 46px 1fr 54px; }
        .lista .album, .lista .acc { display: none; }
      }

      /* 3 · MOSAICO */
      .mosaico .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); grid-auto-flow: dense; gap: 14px; }
      .mosaico .tile { position: relative; aspect-ratio: 1; border-radius: 18px; background: linear-gradient(145deg, var(--cover-a), var(--cover-b)); display: grid; place-items: start center; padding-block-start: 26px; color: #fff; font: 26px Cormorant, serif; }
      .mosaico .tile.grande { grid-column: span 2; grid-row: span 2; font-size: 60px; }
      .mosaico .capa { position: absolute; inset: auto 0 0; padding: 16px; background: linear-gradient(0deg, rgba(20, 12, 18, .82), transparent); border-radius: 0 0 18px 18px; color: #fff; }
      .mosaico .capa strong { display: block; font: 21px Cormorant, serif; }
      .mosaico .capa small { font-size: 11px; opacity: .85; }

      /* 4 · FOCUS */
      .focus .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 30px; block-size: calc(100% - 70px); }
      .focus .arte { border-radius: 26px; padding: 26px; background: radial-gradient(circle at 70% 20%, var(--soft), transparent 60%), var(--surface); border: 1px solid var(--line); display: grid; place-content: center; justify-items: center; gap: 18px; }
      .focus .arte .cover { inline-size: min(70%, 320px); box-shadow: 0 26px 50px rgba(30, 16, 26, .24); font-size: 80px; }
      .focus .titulo { font: 400 clamp(30px, 4.4cqi, 56px)/1 Cormorant, serif; margin: 0; text-align: center; }
      .focus .sub { color: var(--muted); text-align: center; }
      .focus .lista .fila { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 12px; }
      .focus .lista .fila:hover { background: var(--surface); }
      .focus .lista .cover { inline-size: 42px; border-radius: 9px; font-size: 14px; }
      .focus .lista strong { font-size: 13px; display: block; }
      .focus .lista small { color: var(--muted); font-size: 11px; }
      .focus .buscar { margin-block-end: 14px; padding: 11px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; color: var(--muted); font-size: 12px; }
      @container lienzo (max-width: 980px) {
        .focus .grid { grid-template-columns: 1fr; block-size: auto; }
        .focus .arte { min-block-size: 300px; }
      }

      /* 5 · CARRUSEL */
      .carrusel .tira { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block-end: 14px; scrollbar-gutter: stable; }
      .carrusel .tarjeta { flex: 0 0 clamp(180px, 20cqi, 250px); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
      .carrusel .tarjeta .cover { inline-size: 100%; font-size: 48px; }
      .carrusel .tarjeta strong { display: block; font: 21px Cormorant, serif; margin-block-start: 10px; }
      .carrusel .tarjeta small { color: var(--muted); font-size: 11px; }
      .carrusel .play { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 11px; }

      /* 6 · LÍNEA DE TIEMPO */
      .tiempo .grupo { margin-block-end: 24px; }
      .tiempo .anio { position: sticky; inset-block-start: 0; background: var(--bg); font: 10px Mono, monospace; letter-spacing: .16em; color: var(--muted); padding-block: 8px; border-block-end: 1px solid var(--line); }
      .tiempo .fila { display: flex; align-items: center; gap: 14px; padding-block: 10px; border-block-end: 1px solid var(--line); }
      .tiempo .fila .cover { inline-size: 50px; border-radius: 10px; font-size: 17px; }
      .tiempo .fila strong { font-size: 13px; display: block; }
      .tiempo .fila small { color: var(--muted); font-size: 11px; }
      .tiempo .fila .dur { margin-inline-start: auto; font: 10px Mono, monospace; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>Biblioteca de Sakura · maquetas modernas</h1>
      <p>Seis patrones de interfaz contemporáneos. Cambiá tema y ancho para ver cómo se adaptan por container queries.</p>
      <div class="controles">
        <div class="grupo"><span>Diseño</span><div class="tabs" id="tabs" role="tablist"></div></div>
        <div class="grupo"><span>Tema</span><div class="paletas" id="paletas"></div></div>
        <div class="grupo"><span>Ancho</span><div class="anchos" id="anchos"></div></div>
      </div>
    </header>
    <div class="marco"><div class="lienzo" id="lienzo"><div class="vista" id="vista"></div></div></div>
    <div class="nota">
      <h3 id="titulo"></h3>
      <p id="descripcion"></p>
      <small id="detalle"></small>
    </div>

    <script>
      const tracks = [
        ['Gurenge', 'LiSA', 'Álbum 01', '3:20'],
        ['Lilac', 'Queen', 'Álbum 02', '4:02'],
        ['Kaze', 'Sakura', 'Álbum 02', '2:58'],
        ['Aoi', 'Aimer', 'Álbum 03', '3:41'],
        ['Hana', 'Kenshi', 'Álbum 04', '3:12'],
        ['Yuki', 'YUI', 'Álbum 04', '4:18'],
        ['Nagori', 'Ado', 'Álbum 05', '3:36'],
      ];

      const paletas = {
        Sakura: { bg: '#fff6f9', surface: '#ffffff', soft: '#ffe3ee', line: '#f0d9e3', ink: '#3d1626', muted: '#9a6a7d', accent: '#e54d86', coverA: '#ffb3ce', coverB: '#d6306c' },
        Loto: { bg: '#f7eddb', surface: '#fffaf0', soft: '#f0dcb6', line: '#e4d3b2', ink: '#3a120f', muted: '#8a6a2f', accent: '#b93829', coverA: '#f1d994', coverB: '#8a3d22' },
        'La Gran Ola': { bg: '#f3e9d4', surface: '#fffaf0', soft: '#dbe8f2', line: '#dccdb4', ink: '#0d2138', muted: '#46617d', accent: '#163a5f', coverA: '#9fc4e0', coverB: '#163a5f' },
        Vinilo: { bg: '#151210', surface: '#231e1a', soft: '#3a2820', line: '#3d352d', ink: '#f0e5dc', muted: '#a99a8d', accent: '#ff5e3a', coverA: '#ff8a63', coverB: '#6d2a17' },
        Karesansui: { bg: '#eeeadf', surface: '#fffdf8', soft: '#dfd8ca', line: '#d8d2c6', ink: '#2b2721', muted: '#7c756a', accent: '#3c332a', coverA: '#c7c0ae', coverB: '#6b655b' },
      };

      const anchos = [1200, 1000, 820];

      const cover = (tamaño = '') => `<div class="cover ${tamaño}">桜</div>`;
      const filasLista = tracks.map(([t, a, al, d], i) => `
        <div class="fila ${i === 0 ? 'activa' : ''}">
          <span class="num">${String(i + 1).padStart(2, '0')}</span>
          ${cover()}
          <span><strong>${t}</strong><small>${a}</small></span>
          <span class="album">${al}</span>
          <span class="dur">${d}</span>
          <span class="acc"><i>♥</i><i>⋯</i></span>
        </div>`).join('');
      const celdasBento = tracks.slice(1).map(([t, a, , d]) => `
        <div class="celda">${cover()}<span><strong>${t}</strong><small>${a}</small></span><span class="chip">${d}</span></div>`).join('');
      const mosaicos = tracks.map(([t, a], i) => `
        <div class="tile ${i === 0 ? 'grande' : ''}">桜
          <span class="capa"><strong>${t}</strong><small>${a}</small></span>
        </div>`).join('');
      const filasFocus = tracks.map(([t, a]) => `
        <div class="fila">${cover()}<span><strong>${t}</strong><small>${a}</small></span></div>`).join('');
      const tarjetas = tracks.map(([t, a, al]) => `
        <div class="tarjeta">${cover()}<strong>${t}</strong><small>${a} · ${al}</small>
          <button class="play" type="button">▶ Reproducir</button>
        </div>`).join('');
      const gruposTiempo = [['ÁLBUM 01 · 2026', tracks.slice(0, 2)], ['ÁLBUM 02–04 · 2026', tracks.slice(2, 6)], ['ÁLBUM 05 · 2026', tracks.slice(6)]].map(([titulo, items]) => `
        <div class="grupo"><div class="anio">${titulo}</div>
        ${items.map(([t, a, , d]) => `<div class="fila">${cover()}<span><strong>${t}</strong><small>${a}</small></span><span class="dur">${d}</span></div>`).join('')}
        </div>`).join('');

      const disenos = [
        {
          id: 'bento', nombre: 'Bento', titulo: '1 · Bento modular',
          desc: 'Un tablero de mosaicos con una pieza protagonista y celdas compactas. Muy usado en dashboards modernos.',
          detalle: 'CSS grid con areas, tipografía fluida en cqi y dos columnas cuando el contenedor baja de 980 px. Escala bien a muchas pistas.',
          html: `<div class="cabecera"><div><span class="kicker">Tu biblioteca</span><h2>Flores en reproducción</h2></div><span class="kicker">${tracks.length} pistas · local</span></div>
            <div class="grid"><div class="hero">${cover()}<div><h3>${tracks[0][0]}</h3><small style="color:var(--muted)">${tracks[0][1]} · ${tracks[0][3]}</small></div></div>
            ${celdasBento}</div>`,
        },
        {
          id: 'lista', nombre: 'Lista densa', titulo: '2 · Lista densa',
          desc: 'Una tabla moderna y escaneable: número, portada, título, álbum, duración y acciones. Ideal para bibliotecas grandes.',
          detalle: 'Grid por filas con columnas que desaparecen por container query. Cero ruido visual y alto contraste en la fila activa.',
          html: `<div class="cabecera"><div><span class="kicker">Canciones</span><h2>Biblioteca completa</h2></div><span class="kicker">${tracks.length} resultados</span></div>
            <div class="barra"><button class="chip activo" type="button">Todas</button><button class="chip" type="button">Recientes</button><button class="chip" type="button">Favoritas</button><button class="chip" type="button">Álbumes</button></div>
            <div>${filasLista}</div>`,
        },
        {
          id: 'mosaico', nombre: 'Mosaico', titulo: '3 · Mosaico de portadas',
          desc: 'Cuadrícula densa de carátulas con una pieza grande y metadatos superpuestos. Prioriza el arte sobre el texto.',
          detalle: 'grid-auto-flow: dense con aspect-ratio: 1 y una celda de 2×2. Se reordena sola según el ancho disponible.',
          html: `<div class="cabecera"><div><span class="kicker">Galería</span><h2>Portadas en flor</h2></div><span class="kicker">Vista mosaico</span></div>
            <div class="grid">${mosaicos}</div>`,
        },
        {
          id: 'focus', nombre: 'Focus', titulo: '4 · Focus / ahora suena',
          desc: 'Mitad portada protagonista, mitad lista de reproducción. La biblioteca y el reproductor conviven en una sola pantalla.',
          detalle: 'Dos columnas colapsables por container query. La portada usa un halo suave del color del tema en lugar de imágenes externas.',
          html: `<div class="cabecera"><div><span class="kicker">Escuchando</span><h2>Enfoque floral</h2></div><span class="kicker">${tracks.length} pistas</span></div>
            <div class="grid"><div class="arte">${cover()}<h3 class="titulo">${tracks[0][0]}</h3><span class="sub">${tracks[0][1]} · ${tracks[0][2]}</span></div>
            <div><div class="buscar">⌕ Buscar en tu biblioteca…</div><div class="lista">${filasFocus}</div></div></div>`,
        },
        {
          id: 'carrusel', nombre: 'Carrusel', titulo: '5 · Carrusel de álbumes',
          desc: 'Tarjetas deslizables con scroll-snap, como una vitrina. Cada tarjeta muestra portada, título y acción directa.',
          detalle: 'Flex horizontal con scroll-snap y ancho de tarjeta en cqi. Se adapta sin media queries y mantiene el foco por teclado.',
          html: `<div class="cabecera"><div><span class="kicker">Colección</span><h2>Deslizá tus álbumes</h2></div><span class="kicker">→ horizontal</span></div>
            <div class="tira">${tarjetas}</div>`,
        },
        {
          id: 'tiempo', nombre: 'Línea de tiempo', titulo: '6 · Línea de tiempo',
          desc: 'Pistas agrupadas por álbum y año con encabezados fijos. Una biblioteca como historial, no como grilla.',
          detalle: 'Agrupación semántica con sticky headers y filas livianas. Muy cómoda para navegar colecciones extensas.',
          html: `<div class="cabecera"><div><span class="kicker">Historial</span><h2>Tu jardín por álbumes</h2></div><span class="kicker">${tracks.length} pistas</span></div>
            ${gruposTiempo}`,
        },
      ];

      const tabs = document.getElementById('tabs');
      const paletasEl = document.getElementById('paletas');
      const anchosEl = document.getElementById('anchos');
      const lienzo = document.getElementById('lienzo');
      const vista = document.getElementById('vista');
      const titulo = document.getElementById('titulo');
      const descripcion = document.getElementById('descripcion');
      const detalle = document.getElementById('detalle');
      let disenoActual = 0;
      let paletaActual = 'Sakura';
      let anchoActual = 1200;

      function aplicarPaleta() {
        const p = paletas[paletaActual];
        lienzo.style.setProperty('--bg', p.bg);
        lienzo.style.setProperty('--surface', p.surface);
        lienzo.style.setProperty('--soft', p.soft);
        lienzo.style.setProperty('--line', p.line);
        lienzo.style.setProperty('--ink', p.ink);
        lienzo.style.setProperty('--muted', p.muted);
        lienzo.style.setProperty('--accent', p.accent);
        lienzo.style.setProperty('--cover-a', p.coverA);
        lienzo.style.setProperty('--cover-b', p.coverB);
        document.documentElement.style.setProperty('--accent', p.accent);
        [...paletasEl.children].forEach((b) => b.setAttribute('aria-selected', String(b.dataset.nombre === paletaActual)));
      }

      function mostrar(indice) {
        disenoActual = indice;
        const d = disenos[indice];
        vista.className = `vista ${d.id}`;
        vista.innerHTML = d.html;
        titulo.textContent = d.titulo;
        descripcion.textContent = d.desc;
        detalle.textContent = d.detalle;
        [...tabs.children].forEach((b, i) => b.setAttribute('aria-selected', String(i === indice)));
      }

      disenos.forEach((d, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.role = 'tab';
        b.textContent = d.nombre;
        b.addEventListener('click', () => mostrar(i));
        tabs.appendChild(b);
      });
      Object.keys(paletas).forEach((nombre) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.title = nombre;
        b.dataset.nombre = nombre;
        b.style.background = paletas[nombre].accent;
        b.addEventListener('click', () => { paletaActual = nombre; aplicarPaleta(); });
        paletasEl.appendChild(b);
      });
      anchos.forEach((ancho) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = `${ancho}px`;
        b.addEventListener('click', () => {
          anchoActual = ancho;
          lienzo.style.setProperty('--ancho', `${ancho}px`);
          [...anchosEl.children].forEach((x) => x.setAttribute('aria-selected', String(x === b)));
        });
        anchosEl.appendChild(b);
      });
      aplicarPaleta();
      mostrar(0);
      anchosEl.children[0].setAttribute('aria-selected', 'true');
    </script>
  </body>
</html>
