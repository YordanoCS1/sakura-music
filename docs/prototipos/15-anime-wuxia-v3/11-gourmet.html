<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · Gourmet</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#f5ecdc;--pan:#fffaf0;--tinta:#4a3320;--naranja:#d9762b;--verde:#6d8f3f;--suave:#8a7358}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:4px solid var(--naranja)}.nav b{color:var(--naranja)}.nav button.on{color:var(--naranja)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.plato{width:190px;height:190px;border-radius:50%;border:10px solid #fff;outline:3px solid var(--naranja);background:radial-gradient(circle,var(--naranja) 0 35%,var(--verde) 36% 48%,#fff 49%);display:grid;place-items:center;font-size:44px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;background:var(--naranja);color:#fff;padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:4px solid var(--naranja);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.platos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.plato2{aspect-ratio:1;border-radius:50%;border:6px solid #fff;outline:2px solid var(--verde);background:radial-gradient(circle,var(--naranja) 0 40%,var(--verde) 41% 55%,#fff 56%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.plato2 b{background:#fff;padding:3px 7px;font-size:10px;border-radius:10px}
</style></head><body>
<div class="nav"><b>▦ Gourmet</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="plato">▦</div><div class="copy"><p>GOURMET · SABOR SONORO</p><h1>Un banquete de música</h1><p>Cada pista es un plato preparado con esmero.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>MENÚ · 01</small><h1>Biblioteca</h1></div><span>8 PLATOS</span></div><div class="platos"><div class="plato2"><b>Pista 0</b></div><div class="plato2"><b>Pista 1</b></div><div class="plato2"><b>Pista 2</b></div><div class="plato2"><b>Pista 3</b></div><div class="plato2"><b>Pista 4</b></div><div class="plato2"><b>Pista 5</b></div><div class="plato2"><b>Pista 6</b></div><div class="plato2"><b>Pista 7</b></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
