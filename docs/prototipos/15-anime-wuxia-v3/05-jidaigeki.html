<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · Samurái</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#e9dfc8;--pan:#f5edd8;--tinta:#3a2c1c;--indigo:#2f4a6b;--rojo:#a8322a;--suave:#7d6a4c}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:4px solid var(--indigo)}.nav b{color:var(--indigo);letter-spacing:.2em}.nav button.on{color:var(--rojo)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.noren{width:200px;height:180px;display:flex;gap:4px;flex:none}
.noren i{flex:1;background:var(--indigo);border-top:8px solid var(--rojo);height:100%}
.noren i:nth-child(2){height:88%}.noren i:nth-child(3){height:94%}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--indigo);color:var(--indigo);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:4px solid var(--indigo);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.carteles{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.cartel{width:96px;flex:none;height:180px;border:3px solid var(--indigo);border-top:12px solid var(--rojo);background:var(--pan);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.cartel b{font-size:13px;color:var(--indigo)}.cartel small{font-size:9px;color:var(--suave);margin-top:6px}
</style></head><body>
<div class="nav"><b>侍 Samurái</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="noren"><i></i><i></i><i></i></div><div class="copy"><p>侍 · ÉPOCA EDO</p><h1>Canciones de otro tiempo</h1><p>Noren, tabernas y historias de samuráis.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>CASTILLO · 01</small><h1>Biblioteca</h1></div><span>8 RODILLOS</span></div><div class="carteles"><div class="cartel"><b>Pista 0</b><small>巻 01</small></div><div class="cartel"><b>Pista 1</b><small>巻 02</small></div><div class="cartel"><b>Pista 2</b><small>巻 03</small></div><div class="cartel"><b>Pista 3</b><small>巻 04</small></div><div class="cartel"><b>Pista 4</b><small>巻 05</small></div><div class="cartel"><b>Pista 5</b><small>巻 06</small></div><div class="cartel"><b>Pista 6</b><small>巻 07</small></div><div class="cartel"><b>Pista 7</b><small>巻 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
