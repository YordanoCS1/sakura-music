<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 · Vintage</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#e6dfcc;--pan:#f2ecda;--tinta:#3a3020;--laton:#a8813c;--rojo:#9c3328;--suave:#7a6a4c}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:4px double var(--laton)}.nav b{color:var(--laton);letter-spacing:.2em}.nav button.on{color:var(--rojo)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.reloj{width:190px;height:190px;border:10px solid var(--laton);border-radius:50%;display:grid;place-items:center;font-size:50px;color:var(--rojo);background:radial-gradient(circle,rgba(168,129,60,.12),transparent);flex:none}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--laton);color:var(--laton);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:4px double var(--laton);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.engranajes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.engr{aspect-ratio:1;border:6px dashed var(--laton);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.engr b{font-size:11px}.engr small{font-size:8px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>⚙ Vintage</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="reloj">⚙</div><div class="copy"><p>明治 · ERA VINTAGE</p><h1>Música de relojería</h1><p>Engranajes, latón y precisión. Cada pista encaja como una pieza.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>MAQUINARIA · 01</small><h1>Biblioteca</h1></div><span>8 PIEZAS</span></div><div class="engranajes"><div class="engr"><b>Pista 0</b><small>⚙ 01</small></div><div class="engr"><b>Pista 1</b><small>⚙ 02</small></div><div class="engr"><b>Pista 2</b><small>⚙ 03</small></div><div class="engr"><b>Pista 3</b><small>⚙ 04</small></div><div class="engr"><b>Pista 4</b><small>⚙ 05</small></div><div class="engr"><b>Pista 5</b><small>⚙ 06</small></div><div class="engr"><b>Pista 6</b><small>⚙ 07</small></div><div class="engr"><b>Pista 7</b><small>⚙ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
