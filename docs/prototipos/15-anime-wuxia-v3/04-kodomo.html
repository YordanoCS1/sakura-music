<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · Infantil</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#fff9e6;--pan:#fff;--tinta:#4a3a1a;--azul:#4aa3d8;--rojo:#e8615a;--amar:#f5c13b;--verde:#7bc47f}
body{background:var(--fon);color:var(--tinta);font-family:system-ui;font-weight:700}
.nav{background:#fff;border-bottom:5px solid var(--amar)}.nav b{color:var(--rojo)}.nav button.on{background:var(--amar)}
.home{display:flex;align-items:center;gap:46px;min-height:68vh}
.bloques{display:grid;grid-template-columns:repeat(2,80px);gap:10px;flex:none}
.bloques i{height:80px;display:block}.bloques i:nth-child(1){background:var(--rojo);border-radius:50%}.bloques i:nth-child(2){background:var(--azul)}.bloques i:nth-child(3){background:var(--verde);clip-path:polygon(50% 0,100% 100%,0 100%)}.bloques i:nth-child(4){background:var(--amar)}
.copy h1{font-size:46px;margin:8px 0}.copy p{max-width:340px;line-height:1.7}
.btn{display:inline-block;background:var(--rojo);color:#fff;padding:11px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:5px solid var(--amar);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0}
.juguetes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.juguete{aspect-ratio:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}
.juguete strong{font-size:12px}.juguete small{font-size:9px;opacity:.8}
</style></head><body>
<div class="nav"><b>★ Infantil</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="bloques"><i></i><i></i><i></i><i></i></div><div class="copy"><p>★ INFANTIL · ALEGRÍA PURA</p><h1>¡Música para jugar!</h1><p>Colores vivos y formas divertidas. Tu biblioteca es un parque.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>PARQUE · 01</small><h1>Biblioteca</h1></div><span>8 JUGUETES</span></div><div class="juguetes"><div class="juguete" style="background:#e8615a"><strong>Pista 0</strong><small>01</small></div><div class="juguete" style="background:#4aa3d8"><strong>Pista 1</strong><small>02</small></div><div class="juguete" style="background:#7bc47f"><strong>Pista 2</strong><small>03</small></div><div class="juguete" style="background:#f5c13b"><strong>Pista 3</strong><small>04</small></div><div class="juguete" style="background:#e8615a"><strong>Pista 4</strong><small>05</small></div><div class="juguete" style="background:#4aa3d8"><strong>Pista 5</strong><small>06</small></div><div class="juguete" style="background:#7bc47f"><strong>Pista 6</strong><small>07</small></div><div class="juguete" style="background:#f5c13b"><strong>Pista 7</strong><small>08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
