<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Fantasmas</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#0a1018;--pan:#101a24;--tinta:#dff1f5;--cian:#67e8f9;--suave:#7a9ba8}
body{background:linear-gradient(180deg,#0d1a26,#0a1018);color:var(--tinta);font-family:Georgia,serif}
.nav{background:#070e15;border-bottom:1px solid var(--cian)}.nav b{color:var(--cian)}
.home{display:flex;align-items:center;gap:50px;min-height:68vh}
.fantasma{width:170px;height:190px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(103,232,249,.5),transparent);display:grid;place-items:center;font-size:70px;color:var(--cian);filter:drop-shadow(0 0 20px rgba(103,232,249,.4));flex:none}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--cian);color:var(--cian);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:1px solid var(--cian);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.espectros{display:flex;flex-wrap:wrap;gap:14px}
.espectro{width:100px;height:120px;border-radius:50% 50% 0 0;border:1px solid rgba(103,232,249,.35);background:rgba(103,232,249,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.espectro b{font-size:11px}.espectro small{font-size:8px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>☻ Fantasmas</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="fantasma">☻</div><div class="copy"><p>FANTASMAS · ESPÍRITUS SONOROS</p><h1>Ecos del pasado</h1><p>Cada canción es un fantasma que vuelve a sonar.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>ESPÍRITUS · 01</small><h1>Biblioteca</h1></div><span>8 ECOS</span></div><div class="espectros"><div class="espectro"><b>Pista 0</b><small>☻ 01</small></div><div class="espectro"><b>Pista 1</b><small>☻ 02</small></div><div class="espectro"><b>Pista 2</b><small>☻ 03</small></div><div class="espectro"><b>Pista 3</b><small>☻ 04</small></div><div class="espectro"><b>Pista 4</b><small>☻ 05</small></div><div class="espectro"><b>Pista 5</b><small>☻ 06</small></div><div class="espectro"><b>Pista 6</b><small>☻ 07</small></div><div class="espectro"><b>Pista 7</b><small>☻ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
