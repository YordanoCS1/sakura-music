<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 · Kawaii</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#fff7fb;--pan:#fff;--tinta:#7a4a6a;--rosa:#ff9ec4;--menta:#9ee0c8;--lila:#c9b0f0;--suave:#b98ca3}
body{background:var(--fon);color:var(--tinta);font-family:system-ui;font-weight:700;
background-image:radial-gradient(circle at 20% 30%,rgba(255,158,196,.25) 0 12px,transparent 13px),radial-gradient(circle at 80% 70%,rgba(158,224,200,.25) 0 10px,transparent 11px)}
.nav{background:#fff;border-bottom:4px solid var(--rosa)}.nav b{color:var(--rosa)}.nav button.on{background:var(--rosa);color:#fff}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.cara{width:180px;height:180px;border-radius:50%;background:var(--menta);display:grid;place-items:center;font-size:70px;box-shadow:0 12px 30px rgba(158,224,200,.4);flex:none}
.copy h1{font-size:46px;margin:8px 0}.copy p{max-width:340px;line-height:1.7;color:var(--suave)}
.btn{display:inline-block;background:var(--rosa);color:#fff;padding:11px 18px;margin-top:16px;font-size:11px;border-radius:20px}
.tit{display:flex;justify-content:space-between;border-bottom:4px solid var(--rosa);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0}
.kawaiis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kawaii{aspect-ratio:1;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(0,0,0,.06)}
.kawaii b{font-size:11px;color:#fff}.kawaii small{font-size:9px;color:rgba(255,255,255,.8)}
</style></head><body>
<div class="nav"><b>♡ Kawaii</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="cara">(◕‿◕)</div><div class="copy"><p>♡ KAWAII · TODO TIERNO</p><h1>¡Música monísima!</h1><p>Colores pastel, caritas felices y pura ternura.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>PARQUE · 01</small><h1>Biblioteca</h1></div><span>8 AMIGOS</span></div><div class="kawaiis"><div class="kawaii" style="background:#ff9ec4"><b>Pista 0</b><small>♡ 01</small></div><div class="kawaii" style="background:#9ee0c8"><b>Pista 1</b><small>♡ 02</small></div><div class="kawaii" style="background:#c9b0f0"><b>Pista 2</b><small>♡ 03</small></div><div class="kawaii" style="background:#ffd89e"><b>Pista 3</b><small>♡ 04</small></div><div class="kawaii" style="background:#ff9ec4"><b>Pista 4</b><small>♡ 05</small></div><div class="kawaii" style="background:#9ee0c8"><b>Pista 5</b><small>♡ 06</small></div><div class="kawaii" style="background:#c9b0f0"><b>Pista 6</b><small>♡ 07</small></div><div class="kawaii" style="background:#ffd89e"><b>Pista 7</b><small>♡ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
