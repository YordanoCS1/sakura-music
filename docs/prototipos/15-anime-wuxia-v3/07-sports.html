<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>07 · Deportes</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#eef1e6;--pan:#fff;--tinta:#1f3324;--verde:#2e7d4f;--linea:#fff;--suave:#6c7d6e}
body{background:var(--fon);color:var(--tinta);font-family:system-ui;font-weight:700;
background-image:repeating-linear-gradient(90deg,rgba(46,125,79,.06) 0 1px,transparent 1px 40px)}
.nav{background:var(--verde);color:#fff;border-bottom:4px solid #fff}.nav b{color:#fff}.nav button{color:rgba(255,255,255,.7)}.nav button.on{background:#fff;color:var(--verde)}
.home{display:flex;align-items:center;gap:46px;min-height:68vh}
.balon{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 30%,var(--tinta) 32%);border:4px solid var(--verde);display:grid;place-items:center;font-size:50px;color:#fff;flex:none}
.copy h1{font-size:46px;margin:8px 0;text-transform:uppercase}.copy p{max-width:340px;line-height:1.7;color:var(--suave)}
.btn{display:inline-block;background:var(--verde);color:#fff;padding:11px 16px;margin-top:16px;font-size:11px;text-transform:uppercase}
.tit{background:var(--verde);color:#fff;padding:10px;display:flex;justify-content:space-between}.tit h1{font-size:24px;margin:0}
.cancha{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.jugador{aspect-ratio:1;border:3px solid var(--verde);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.jugador b{font-size:18px;color:var(--verde)}.jugador small{font-size:9px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>⚽ Deportes</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="balon">⚽</div><div class="copy"><p>DEPORTES · ESPÍRITU DE EQUIPO</p><h1>¡Jugá su música!</h1><p>Cada canción es un partido. Tu biblioteca, en la cancha.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><span>EQUIPO / BIBLIOTECA</span><span>8 JUGADORES</span></div><div class="cancha"><div class="jugador"><b>01</b><small>Pista 0</small></div><div class="jugador"><b>02</b><small>Pista 1</small></div><div class="jugador"><b>03</b><small>Pista 2</small></div><div class="jugador"><b>04</b><small>Pista 3</small></div><div class="jugador"><b>05</b><small>Pista 4</small></div><div class="jugador"><b>06</b><small>Pista 5</small></div><div class="jugador"><b>07</b><small>Pista 6</small></div><div class="jugador"><b>08</b><small>Pista 7</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
