<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>12 · Místico</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#eee9dc;--pan:#f8f3e6;--tinta:#2b2a3a;--indigo:#3d4a8a;--rojo:#b8322a;--suave:#77738a}
body{background:var(--fon);color:var(--tinta);font-family:Georgia,serif}
.nav{background:var(--pan);border-bottom:4px solid var(--indigo)}.nav b{color:var(--indigo);letter-spacing:.2em}.nav button.on{color:var(--rojo)}
.home{display:flex;align-items:center;gap:48px;min-height:68vh}
.sello{width:190px;height:190px;border:4px solid var(--indigo);border-radius:50%;display:grid;place-items:center;font-size:64px;color:var(--rojo);position:relative;flex:none}
.sello::before{content:'';position:absolute;inset:12px;border:2px dashed var(--indigo);border-radius:50%}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--indigo);color:var(--indigo);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:4px solid var(--indigo);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.ofuda{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ofuda2{height:150px;border:3px solid var(--indigo);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.ofuda2 b{font-size:24px;color:var(--rojo)}.ofuda2 small{font-size:9px;color:var(--suave);margin-top:6px}
</style></head><body>
<div class="nav"><b>陰 Místico</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="sello">陰</div><div class="copy"><p>陰陽 · MÍSTICO</p><h1>Música yin y yang</h1><p>Sellos, conjuros y el equilibrio de los sonidos.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>CONJUROS · 01</small><h1>Biblioteca</h1></div><span>8 OFUDA</span></div><div class="ofuda"><div class="ofuda2"><b>陰</b><small>Pista 0</small></div><div class="ofuda2"><b>陰</b><small>Pista 1</small></div><div class="ofuda2"><b>陰</b><small>Pista 2</small></div><div class="ofuda2"><b>陰</b><small>Pista 3</small></div><div class="ofuda2"><b>陰</b><small>Pista 4</small></div><div class="ofuda2"><b>陰</b><small>Pista 5</small></div><div class="ofuda2"><b>陰</b><small>Pista 6</small></div><div class="ofuda2"><b>陰</b><small>Pista 7</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
