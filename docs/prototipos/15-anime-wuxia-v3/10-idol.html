<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 · Idol</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#fff5fb;--pan:#fff;--tinta:#5a2a55;--rosa:#ff5fb0;--cian:#5fd8ff;--oro:#ffd65f;--suave:#b07fa5}
body{background:var(--fon);color:var(--tinta);font-family:system-ui;font-weight:700;
background-image:repeating-linear-gradient(45deg,rgba(255,95,176,.06) 0 6px,transparent 6px 12px)}
.nav{background:#fff;border-bottom:4px solid var(--rosa)}.nav b{color:var(--rosa)}.nav button.on{background:var(--rosa);color:#fff}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:68vh}
.estrellas{font-size:70px;color:var(--oro);text-shadow:0 0 20px var(--oro)}
.copy h1{font-size:48px;margin:10px 0;background:linear-gradient(90deg,var(--rosa),var(--cian));-webkit-background-clip:text;color:transparent}
.copy p{color:var(--suave);max-width:400px;line-height:1.7}
.btn{display:inline-block;background:var(--rosa);color:#fff;padding:11px 18px;margin-top:16px;font-size:11px;border-radius:20px}
.tit{background:linear-gradient(90deg,var(--rosa),var(--cian));color:#fff;padding:10px;display:flex;justify-content:space-between}.tit h1{font-size:24px;margin:0}
.fans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fan{aspect-ratio:1;border-radius:50%;border:4px solid var(--rosa);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(95,216,255,.2),#fff)}
.fan b{font-size:11px;color:var(--rosa)}.fan small{font-size:9px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>★ Idol</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="estrellas">★ ★ ★</div><div class="copy"><p>★ IDOL · BRillo EN EL ESCENARIO</p><h1>Encendé el escenario</h1><p> luces, sonrisas y tu lista de canciones favoritas.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><span>IDOL / SETLIST</span><span>8 CANCIONES</span></div><div class="fans"><div class="fan"><b>Pista 0</b><small>★ 01</small></div><div class="fan"><b>Pista 1</b><small>★ 02</small></div><div class="fan"><b>Pista 2</b><small>★ 03</small></div><div class="fan"><b>Pista 3</b><small>★ 04</small></div><div class="fan"><b>Pista 4</b><small>★ 05</small></div><div class="fan"><b>Pista 5</b><small>★ 06</small></div><div class="fan"><b>Pista 6</b><small>★ 07</small></div><div class="fan"><b>Pista 7</b><small>★ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
