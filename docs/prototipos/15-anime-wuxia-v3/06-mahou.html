<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>06 · Magia</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;min-height:100vh}
.nav{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav b{font-size:13px;letter-spacing:.1em}
.nav button{background:none;border:0;font:11px system-ui;cursor:pointer;padding:6px 12px}
.vista{display:none;height:calc(100vh - 46px);overflow:auto;padding:24px}
.vista.on{display:block}

:root{--fon:#160f2e;--pan:#221845;--tinta:#f2eaff;--morado:#b98cff;--oro:#f5d76e;--suave:#a898d0}
body{background:radial-gradient(circle at 50% 20%,#2a1c55,#160f2e);color:var(--tinta);font-family:Georgia,serif}
.nav{background:#100a24;border-bottom:2px solid var(--morado)}.nav b{color:var(--oro)}
.home{display:flex;align-items:center;gap:50px;min-height:68vh}
.varita{width:10px;height:200px;background:linear-gradient(180deg,var(--oro),#fff);transform:rotate(28deg);position:relative;flex:none;margin:0 60px}
.varita::after{content:'✦';position:absolute;top:-38px;left:-34px;font-size:48px;color:var(--oro);text-shadow:0 0 24px var(--oro)}
.copy h1{font-size:46px;font-weight:400}.copy p{max-width:340px;line-height:1.9;color:var(--suave)}
.btn{display:inline-block;border:1px solid var(--oro);color:var(--oro);padding:10px 16px;margin-top:16px;font-size:11px}
.tit{display:flex;justify-content:space-between;border-bottom:2px solid var(--oro);padding-bottom:10px;margin-bottom:20px}.tit h1{font-size:30px;margin:0;font-weight:400}
.hechizos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.hechizo{height:110px;border:1px solid rgba(245,215,110,.4);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(185,140,255,.35),transparent 70%)}
.hechizo b{font-size:12px}.hechizo small{font-size:8px;color:var(--suave)}
</style></head><body>
<div class="nav"><b>✦ Magia</b><nav><button class="on" data-v="home">Inicio</button><button data-v="lib">Biblioteca</button><button>Buscar</button><button>Cola</button></nav></div>
<section class="vista on" id="home"><div class="home"><div class="varita"></div><div class="copy"><p>✦ MAGIA · MAGIA SONORA</p><h1>Hechizos en cada nota</h1><p>Una varita, un conjuro y tu biblioteca encantada.</p><span class="btn">Abrir biblioteca →</span></div></div></section><section class="vista" id="lib"><div class="tit"><div><small>CONJUROS · 01</small><h1>Biblioteca</h1></div><span>8 HECHIZOS</span></div><div class="hechizos"><div class="hechizo"><b>Pista 0</b><small>✦ 01</small></div><div class="hechizo"><b>Pista 1</b><small>✦ 02</small></div><div class="hechizo"><b>Pista 2</b><small>✦ 03</small></div><div class="hechizo"><b>Pista 3</b><small>✦ 04</small></div><div class="hechizo"><b>Pista 4</b><small>✦ 05</small></div><div class="hechizo"><b>Pista 5</b><small>✦ 06</small></div><div class="hechizo"><b>Pista 6</b><small>✦ 07</small></div><div class="hechizo"><b>Pista 7</b><small>✦ 08</small></div></div></section>
<script>document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.vista').forEach(v=>v.classList.remove('on'));
 document.getElementById(b.dataset.v).classList.add('on');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');});
</script></body></html>
