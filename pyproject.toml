[project]
name = "sakura-music"
version = "0.1.0"
description = "Gestor y descargador de musica"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "yt-dlp>=2024.12.13",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# Herramientas de desarrollo y pruebas. Instalar con `pip install -e .[dev]`.
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
sakura-music = "sakura.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sakura*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Los scripts de previsualizacion ajustan sys.path antes de importar el paquete.
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
# Path data de Lucide: verbatim, no se puede partir sin corromper el SVG.
"sakura/ui/icons.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PySide6 marca como deprecated `invalidateRowsFilter()`, que es la API
    # correcta para re-filtrar un QSortFilterProxyModel en Qt 6. El patron no
    # lleva `:` porque ese caracter separa los campos del filtro.
    "ignore:Function.*QSortFilterProxyModel.*invalidate:DeprecationWarning",
]