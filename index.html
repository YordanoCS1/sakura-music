<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakura Music</title>
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // Leemos el tema antes del primer paint para que el splash ya arranque
      // con la estética correcta (sin parpadeo del tema por defecto).
      (function () {
        var tema = 'space';
        try {
          var guardado = localStorage.getItem('sakura_theme');
          var conocidos = ['space','sumie','byobu','shoji','origami','swiss','sumiink','moonlit','ledger','shonen','ghost','samurai','kawaii','yoru','hanabi','aizuri'];
          if (guardado && conocidos.indexOf(guardado) !== -1) tema = guardado;
          else if (guardado) tema = 'custom';
        } catch (e) {}
        document.documentElement.setAttribute('data-splash', tema);
      })();
    </script>
    <style>
      /* ---- Splash de arranque: variables por tema ---- */
      html, body { margin: 0; background: var(--sp-bg, #fbf7f4); }
      :root {
        --sp-bg:#fbf7f4; --sp-fg:#22181d; --sp-accent:#d13f87;
        --sp-accent2:#b5126a; --sp-glow:rgba(236,72,153,.18); --sp-shape:#1a1029;
        --sp-font:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
        --sp-glifo:"桜"; --sp-radio:50%;
      }
      html[data-splash='sumie'], html[data-splash='sumiink'] {
        --sp-bg:#0c0c0c; --sp-fg:#e8e5dd; --sp-accent:#e8e5dd; --sp-accent2:#9a968c;
        --sp-glow:rgba(232,229,221,.12); --sp-shape:#1a1a1a;
        --sp-font:Georgia,serif; --sp-radio:0%;
      }
      html[data-splash='byobu'], html[data-splash='shoji'] {
        --sp-bg:#f3ebd9; --sp-fg:#2c241a; --sp-accent:#a8442f; --sp-accent2:#c9b28a;
        --sp-glow:rgba(168,68,47,.14); --sp-shape:#c9b28a;
        --sp-font:Georgia,serif; --sp-radio:2px;
      }
      html[data-splash='origami'] {
        --sp-bg:#fff8fa; --sp-fg:#402631; --sp-accent:#d9547f; --sp-accent2:#f3c9d8;
        --sp-glow:rgba(217,84,127,.18); --sp-shape:#d9547f;
        --sp-font:Georgia,serif; --sp-radio:0%;
      }
      html[data-splash='swiss'] {
        --sp-bg:#f2f2f0; --sp-fg:#111; --sp-accent:#111; --sp-accent2:#555;
        --sp-glow:rgba(0,0,0,.08); --sp-shape:#111; --sp-radio:0%;
      }
      html[data-splash='moonlit'], html[data-splash='ghost'] {
        --sp-bg:#0b1324; --sp-fg:#dfe8f7; --sp-accent:#8fb6e8; --sp-accent2:#3f6b9c;
        --sp-glow:rgba(143,182,232,.22); --sp-shape:#1b2c45;
        --sp-font:Georgia,serif; --sp-radio:50%;
      }
      html[data-splash='ledger'] {
        --sp-bg:#f4eddc; --sp-fg:#33291d; --sp-accent:#a33a2a; --sp-accent2:#c9b99a;
        --sp-glow:rgba(163,58,42,.12); --sp-shape:#a33a2a;
        --sp-font:"IBM Plex Mono",Consolas,monospace; --sp-radio:50%;
      }
      html[data-splash='shonen'] {
        --sp-bg:#fff6e8; --sp-fg:#1c1c1c; --sp-accent:#ff6b1a; --sp-accent2:#ffb800;
        --sp-glow:rgba(255,107,26,.2); --sp-shape:#1c1c1c;
        --sp-radio:0%;
      }
      html[data-splash='samurai'] {
        --sp-bg:#1a1512; --sp-fg:#efe6d6; --sp-accent:#c9a961; --sp-accent2:#b7352a;
        --sp-glow:rgba(183,53,42,.25); --sp-shape:#241c17;
        --sp-font:Georgia,serif; --sp-radio:50%;
      }
      html[data-splash='kawaii'] {
        --sp-bg:#fff7fb; --sp-fg:#7a4a6a; --sp-accent:#ff9ec4; --sp-accent2:#9ee0c8;
        --sp-glow:rgba(255,158,196,.28); --sp-shape:#ff9ec4;
        --sp-radio:50%;
      }
      html[data-splash='yoru'] {
        --sp-bg:#1a1008; --sp-fg:#fde3bf; --sp-accent:#f59e0b; --sp-accent2:#b45309;
        --sp-glow:rgba(245,158,11,.2); --sp-shape:#2a1a0c;
      }
      html[data-splash='hanabi'] {
        --sp-bg:#0a0a1a; --sp-fg:#f0e9ff; --sp-accent:#22d3ee; --sp-accent2:#d946ef;
        --sp-glow:rgba(34,211,238,.25); --sp-shape:#151530;
      }
      html[data-splash='aizuri'] {
        --sp-bg:#0b2340; --sp-fg:#dbeafe; --sp-accent:#38bdf8; --sp-accent2:#1e3a8a;
        --sp-glow:rgba(56,189,248,.2); --sp-shape:#123456;
      }
      html[data-splash='custom'] {
        --sp-bg:#faf5e9; --sp-fg:#2c241a; --sp-accent:#a8442f; --sp-accent2:#c9b28a;
        --sp-glow:rgba(168,68,47,.15); --sp-shape:#2c241a;
        --sp-radio:2px;
      }

      #sakura-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; background: var(--sp-bg); color: var(--sp-fg); font-family: var(--sp-font);
        transition: opacity 420ms ease, visibility 420ms ease;
      }
      #sakura-splash::before {
        content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%;
        background: radial-gradient(circle, var(--sp-glow), transparent 62%);
        filter: blur(10px); pointer-events: none;
        animation: sakura-glow 2.6s ease-in-out infinite;
      }
      #sakura-splash.is-hidden { opacity: 0; visibility: hidden; }

      /* Figura central: se transforma según el tema */
      .splash-vinyl {
        position: relative; width: 128px; height: 128px; border-radius: var(--sp-radio);
        background: var(--sp-shape); overflow: hidden;
        box-shadow: 0 18px 50px var(--sp-glow);
        animation: sakura-spin 4s linear infinite;
        display: flex; align-items: center; justify-content: center;
      }
      .splash-vinyl::before {
        content: ""; position: absolute; inset: 14px; border-radius: var(--sp-radio);
        border: 1.5px solid rgba(255,255,255,.1);
      }
      .splash-vinyl::after {
        content: ""; position: absolute; inset: 28px; border-radius: var(--sp-radio);
        border: 1px solid rgba(255,255,255,.07);
      }
      .splash-label {
        view-transition-name: sakura-glifo;
        position: relative; z-index: 1;
        width: 74px; height: 74px; border-radius: var(--sp-radio);
        background: linear-gradient(135deg, var(--sp-accent), var(--sp-accent2));
        display: flex; align-items: center; justify-content: center;
        color: var(--sp-fg); font-size: 26px;
        font-family: "Hiragino Kaku Gothic","Yu Gothic","Meiryo",sans-serif;
        animation: sakura-counter 4s linear infinite;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
      }
      .splash-word {
        font-size: 30px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
        color: var(--sp-fg);
        clip-path: inset(0 100% 0 0);
        animation: sakura-reveal 1.1s cubic-bezier(.22,1,.36,1) 240ms forwards;
      }
      .splash-bar { width: 190px; height: 3px; border-radius: 999px; background: var(--sp-glow); overflow: hidden; }
      .splash-bar > i {
        display: block; width: 0; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, var(--sp-accent), var(--sp-accent2));
        animation: sakura-fill 900ms cubic-bezier(.22,1,.36,1) 120ms forwards;
      }

      /* Variantes estructurales por tema */
      html[data-splash='shonen'] .splash-word { font-style: italic; transform: skewX(-6deg); text-shadow: 4px 4px 0 var(--sp-accent2); }
      html[data-splash='samurai'] .splash-vinyl { width:140px; height:140px; border:4px solid var(--sp-accent); background:var(--sp-shape); }
      html[data-splash='kawaii'] .splash-vinyl { width:110px; height:110px; animation:sakura-latido 1.8s ease-in-out infinite; }
      html[data-splash='swiss'] .splash-vinyl { width:104px; height:104px; border:3px solid var(--sp-fg); }
      html[data-splash='origami'] .splash-vinyl { clip-path:polygon(0 0,100% 0,100% 78%,78% 100%,0 100%); animation:sakura-pliegue 3s ease-in-out infinite; }
      html[data-splash='ledger'] .splash-word { font-weight:400; letter-spacing:.24em; }
      html[data-splash='ghost'] .splash-vinyl { border-radius:50% 50% 0 0; height:140px; animation:sakura-flotar 3s ease-in-out infinite; }
      html[data-splash='moonlit'] .splash-vinyl { box-shadow:0 0 50px var(--sp-glow),inset 0 0 30px var(--sp-glow); }

      /* ---- Figuras propias por tema (sin el 桜 genérico) ---- */
      .splash-label::after { font-family:"Hiragino Kaku Gothic","Yu Gothic","Meiryo",sans-serif; line-height:1; }
      html[data-splash='space'] .splash-label::after { content:"桜"; }
      html[data-splash='sumie'] .splash-label::after,
      html[data-splash='sumiink'] .splash-label::after { content:"墨"; font-family:Georgia,serif; font-size:36px; }
      html[data-splash='byobu'] .splash-label::after { content:"屏"; font-family:Georgia,serif; font-size:32px; }
      html[data-splash='shoji'] .splash-label::after { content:"障"; font-family:Georgia,serif; font-size:32px; }
      html[data-splash='origami'] .splash-label::after { content:"折"; font-family:Georgia,serif; font-size:32px; }
      html[data-splash='swiss'] .splash-label::after { content:"+"; font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:46px; }
      html[data-splash='moonlit'] .splash-label::after { content:"☾"; font-family:Georgia,serif; font-size:40px; }
      html[data-splash='ledger'] .splash-label::after { content:"帳"; font-family:"IBM Plex Mono",Consolas,monospace; font-size:30px; }
      html[data-splash='shonen'] .splash-label::after { content:"⚡"; font-size:38px; }
      html[data-splash='samurai'] .splash-label::after { content:"侍"; font-family:Georgia,serif; font-size:36px; }
      html[data-splash='kawaii'] .splash-label::after { content:"(◕‿◕)"; font-family:system-ui,sans-serif; font-size:16px; }
      html[data-splash='ghost'] .splash-label::after { content:"☻"; font-family:Georgia,serif; font-size:38px; }
      html[data-splash='yoru'] .splash-label::after { content:"夜"; font-family:Georgia,serif; font-size:34px; }
      html[data-splash='hanabi'] .splash-label::after { content:"✺"; font-size:40px; }
      html[data-splash='aizuri'] .splash-label::after { content:"藍"; font-family:Georgia,serif; font-size:34px; }
      html[data-splash='custom'] .splash-label::after { content:"◆"; font-size:30px; }

      /* Kawaii: cara sonriente sobre círculo rosa */
      html[data-splash='kawaii'] .splash-vinyl { background:#9ee0c8; }
      html[data-splash='kawaii'] .splash-label { background:transparent; box-shadow:none; color:#7a4a6a; }
      /* Fantasmas: figura con forma de fantasma, sin anillos */
      html[data-splash='ghost'] .splash-vinyl::before,
      html[data-splash='ghost'] .splash-vinyl::after { display:none; }
      /* Shōnen: cuadrado con rayos, sin anillos */
      html[data-splash='shonen'] .splash-vinyl::before,
      html[data-splash='shonen'] .splash-vinyl::after { display:none; }
      html[data-splash='shonen'] .splash-label { background:linear-gradient(135deg,#ff6b1a,#ffb800); color:#1c1c1c; }

      /* Las figuras con orientación no deben girar: se ven de cabeza. */
      html[data-splash='shonen'] .splash-vinyl,
      html[data-splash='shonen'] .splash-label,
      html[data-splash='kawaii'] .splash-label,
      html[data-splash='ghost'] .splash-label,
      html[data-splash='moonlit'] .splash-label,
      html[data-splash='swiss'] .splash-label,
      html[data-splash='hanabi'] .splash-label { animation: none; }

      /* Handoff splash -> nav: solo se anima el glifo, sin crossfade de pagina */
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
      ::view-transition-old(sakura-glifo), ::view-transition-new(sakura-glifo) {
        animation-duration: 720ms;
        animation-timing-function: cubic-bezier(.22, 1, .36, 1);
        mix-blend-mode: normal;
      }
      ::view-transition-old(sakura-glifo) { animation-name: glifo-salir; }
      ::view-transition-new(sakura-glifo) { animation-name: glifo-entrar; }
      @keyframes glifo-salir { to { opacity: 0; transform: scale(.6); } }
      @keyframes glifo-entrar { from { opacity: 0; transform: scale(1.4); } }

      @keyframes sakura-spin { to { transform: rotate(360deg); } }
      @keyframes sakura-counter { to { transform: rotate(-360deg); } }
      @keyframes sakura-fill { to { width: 100%; } }
      @keyframes sakura-reveal { to { clip-path: inset(0 0 0 0); } }
      @keyframes sakura-glow { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes sakura-latido { 0%,100% { transform:scale(1); } 50% { transform:scale(1.12); } }
      @keyframes sakura-pliegue { 0%,100% { clip-path:polygon(0 0,100% 0,100% 78%,78% 100%,0 100%); } 50% { clip-path:polygon(0 0,100% 0,100% 60%,60% 100%,0 100%); } }
      @keyframes sakura-flotar { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-14px); } }

      @media (prefers-reduced-motion: reduce) {
        .splash-vinyl, .splash-label { animation: none; }
        .splash-word { animation-duration: 300ms; }
        .splash-bar > i { animation-duration: 300ms; }
        #sakura-splash::before { animation: none; }
      }
    </style>
  </head>

  <body class="antialiased overflow-hidden select-none">
    <div id="sakura-splash" role="status" aria-label="Cargando Sakura Music">
      <div class="splash-vinyl">
        <div class="splash-label" aria-hidden="true"></div>
      </div>
      <div class="splash-word" aria-hidden="true">Sakura</div>
      <div class="splash-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
