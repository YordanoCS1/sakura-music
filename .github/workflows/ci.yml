name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Comprobaciones (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias npm
        run: npm ci

      - name: Tipos del frontend
        run: npm run typecheck

      - name: Lint del frontend
        run: npm run lint

      - name: Formato del frontend
        run: npm run format:check

      - name: Tests del frontend
        run: npm test

      - name: Navegador de Playwright (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Navegador de Playwright (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Tests E2E del frontend
        run: npm run test:e2e

      - name: Build del frontend
        run: npm run build

      - name: Formato de Rust
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Lint de Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: npm run audit
