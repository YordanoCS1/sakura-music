name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Comprobaciones (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias npm
        run: npm ci

      - name: Tipos del frontend
        run: npm run typecheck

      - name: Lint del frontend
        run: npm run lint

      - name: Formato del frontend
        run: npm run format:check

      - name: Tests del frontend
        run: npm test

      - name: Build del frontend
        run: npm run build

      - name: Formato de Rust
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Lint de Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: npm run audit

  build:
    name: Instalador de Windows
    needs: checks
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar instalador
        run: npm run tauri build

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: sakura-music-windows
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
